# .github/workflows/vigia-despliegue.yml — SCRUM-677
#
# ═════════════════════════════════════════════════════════════════════════════════════════════
# EL VIGÍA DEL DESPLIEGUE · ÉSTE ES EL QUE CANTA
#
# Producción estuvo NUEVE DÍAS sin desplegar. Treinta despliegues fallaron el healthcheck y
# Railway mantuvo vivo el anterior: la web funcionaba, no hubo caída, no hubo alerta. El síntoma
# era «no cambia nada». Lo destapó el fundador preguntando, no un mecanismo.
#
# 🔴 POR QUÉ PROGRAMADO Y NO SÓLO EN EL PR. Ataca la causa real: fueron nueve días **en los que
# nadie mergeó nada**, y por eso nadie miró. Un vigía que sólo corre cuando alguien abre un PR
# habría estado igual de callado. Éste corre aunque el repositorio esté parado.
#
# ── DÓNDE AVISA: AQUÍ MISMO. El workflow FALLA ────────────────────────────────────────────────
# GitHub ya notifica un workflow programado en rojo. Cero dependencias nuevas (regla 36), cero
# integraciones que decidir, cero canal que inventar. El aviso es el propio job en rojo.
#
# ── CADENCIA: cada 2 h ───────────────────────────────────────────────────────────────────────
# Con el margen en 6 h, un cron cada 6 h dejaría el aviso llegando entre las 6 y las 12 horas —
# el peor caso duplica el margen. Cada 2 h lo acota a entre 6 y 8. No se baja más: el vigía sólo
# lee un endpoint público, pero un cron más apretado no compra nada frente a un margen de 6 h.
#
# ⚠️ GitHub NO GARANTIZA la puntualidad de `schedule`: en horas de mucha carga puede retrasarse, y
# en un repositorio sin actividad de 60 días lo desactiva. Las dos cosas hacen que este vigía
# pueda callar sin que nadie se entere — el mismo modo de fallo que viene a resolver. Queda
# declarado en `docs/master/SCRUM-677.md` como hueco, no disimulado.
# ═════════════════════════════════════════════════════════════════════════════════════════════
name: Vigía del despliegue

on:
  schedule:
    # Cada 2 horas, en punto. UTC.
    - cron: '0 */2 * * *'
  # Para poder ejercitarlo a mano sin esperar al cron — y para poder VERLO SALTAR, que es la
  # mitad que no se puede probar en un test puro.
  workflow_dispatch:
    inputs:
      margen:
        description: 'Margen en horas (por defecto, el propuesto en el código)'
        required: false
        default: ''

permissions:
  contents: read
  # SCRUM-1123 · para abrir/actualizar el Issue de aviso cuando el vigía canta. El vigía sigue
  # sin necesitar ninguna credencial para MIRAR (regla intacta); esto es sólo para AVISAR.
  issues: write

concurrency:
  group: vigia-despliegue
  cancel-in-progress: true

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 🔴 EL HISTORIAL ENTERO, y no es un capricho: el vigía tiene que poder responder
          # `git cat-file -e <sha de producción>` y `git merge-base --is-ancestor`. Con un
          # checkout superficial, un commit de hace nueve días NO ESTARÍA en el clon y el vigía
          # se declararía ciego — exactamente en el caso que existe para detectar.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ═══════════════════════════════════════════════════════════════════════════════════════
      # SCRUM-716 · LA LECTURA ANTERIOR, para poder distinguir CONGELADO de RETRASADO
      #
      # El vigía sin memoria pintaba igual «producción parada» y «producción desplegando despacio».
      # El 6-sep-2026 eso mandó a buscar un healthcheck sano y bloqueó cinco ramas media jornada.
      # El discriminador es comparar con la lectura de la ejecución anterior — y para eso hace
      # falta que sobreviva algo entre ejecuciones, que hasta hoy no sobrevivía NADA: runner
      # efímero, checkout limpio, sin caché y sin artifacts.
      #
      # 🔴 ES `actions/cache` Y NO UN ARTIFACT NI `contents: write`, y el motivo es el que hace
      # que el diseño aguante: **cuando la caché se pierde, la respuesta es NO SE SABE** — un
      # valor de primera clase que el vigía ya sabe emitir, ni verde ni congelado. No pide
      # permisos nuevos y no escribe una sola línea en el repositorio.
      #
      # La clave lleva el `run_id` para que CADA ejecución guarde la suya (una clave repetida no
      # se vuelve a guardar), y `restore-keys` recupera la más reciente que empiece igual. Es el
      # patrón de caché rodante, no uno inventado.
      #
      # ═══════════════════════════════════════════════════════════════════════════════════════
      # 🔴 SCRUM-716c · AQUÍ HABÍA UN `actions/cache@v4` A SECAS, Y NO GUARDABA NUNCA
      #
      # MEDIDO en la definición de la acción, no deducido: `actions/cache@v4` guarda en un paso
      # POST declarado con **`post-if: "success()"`**. Y el vigía **falla el job a propósito** —
      # ése es su mecanismo de aviso, «el aviso es el propio job en rojo», ahí arriba—. Así que:
      #
      #     vigía en ROJO  → el post no corre → NO SE GUARDA la lectura
      #     vigía en VERDE → el post corre    → se guarda
      #
      # O sea que la memoria se guardaba **sólo cuando no hacía falta**, y nunca cuando sí: en
      # cuanto producción se quedaba atrás, el vigía se ponía en rojo, no guardaba, y la ejecución
      # siguiente volvía a no tener con qué comparar. NO_SE_SABE perpetuo, con el dato correcto y
      # la conclusión imposible. Es lo que se vio el 7-sep-2026: prod=15fb3b2f · main=b07546cf ·
      # 17,1 h · exit 2, mientras producción SÍ estaba desplegando (RETRASADO PERO DESPLEGANDO).
      #
      # Se parte en dos: `restore` al principio y `save` al final **con `if: always()`**.
      # `actions/cache/save` es un paso NORMAL (`main:`, sin `post-if`), así que `always()` basta
      # y se ejecuta también cuando el vigía ha salido en rojo — comprobado en su `action.yml`.
      #
      # ⛔ ESTO NO RELAJA NADA. El vigía sigue saliendo con el mismo código y el job sigue en rojo;
      # lo único que cambia es que la lectura de ESTA ejecución sobrevive para la siguiente. Los
      # tres veredictos siguen siendo tres y NO_SE_SABE sigue sin ser verde.
      # ═══════════════════════════════════════════════════════════════════════════════════════
      - name: Recuperar la constancia de la ejecución anterior
        uses: actions/cache/restore@v4
        with:
          path: .vigia
          key: vigia-estado-${{ github.run_id }}
          restore-keys: |
            vigia-estado-

      # Sin `npm ci`: el vigía no importa nada de `node_modules`. Sólo `node:child_process` y
      # `fetch`. Instalar dependencias aquí sería tiempo y superficie que no hace falta.
      - name: ¿Está producción corriendo lo que hay en main?
        # Sin esta variable el vigía no lee ni escribe historial y contesta «no se sabe», que es
        # lo honrado. La ruta va bajo `path:` de la caché de arriba, o no sobreviviría.
        id: vigia
        env:
          VIGIA_ESTADO: .vigia/constancias.log
        run: |
          # SCRUM-1123 · `set +e` a propósito: el paso sigue saliendo con el MISMO código (abajo
          # se hace `exit "$codigo"`, el job sigue en rojo igual que siempre), pero primero se
          # captura para que el paso de aviso sepa SIN adivinar si tocaba avisar. Sin esto, `bash
          # -e` cortaría el step en el primer `exit` no-cero y nunca se llegaría a leer $?.
          set +e
          if [ -n "${{ inputs.margen }}" ]; then
            node scripts/vigilante-de-despliegue.mjs --margen "${{ inputs.margen }}"
          else
            node scripts/vigilante-de-despliegue.mjs
          fi
          codigo=$?
          echo "salida=$codigo" >> "$GITHUB_OUTPUT"
          exit "$codigo"

      # 🔴 SCRUM-716c · `if: always()` Y NO ES OPCIONAL: es la línea entera del arreglo.
      #
      # Sin ella, guardar vuelve a depender de que el vigía haya ido bien — y el vigía va mal
      # exactamente cuando su lectura hace falta. Un paso de guardado condicionado al éxito del
      # paso que vigila es una memoria que sólo recuerda los días buenos.
      #
      # Va DESPUÉS del vigía a propósito: guarda el renglón que ACABA de anotar, no el heredado.
      - name: Guardar la constancia de ESTA ejecución (también si el vigía canta)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vigia
          key: vigia-estado-${{ github.run_id }}

      # ═══════════════════════════════════════════════════════════════════════════════════════
      # SCRUM-1123 · AVISAR DE VERDAD, NO SÓLO PONER EL JOB EN ROJO
      #
      # El 24/25-sep-2026 este vigía llevaba DÍAS en FAILURE (SCRUM-1122: 193 h de hueco) y nadie
      # lo miró: «el job falla» sólo avisa a quien tenga activada la notificación de GitHub para
      # workflows programados en rojo, y aquí no la tenía nadie. El síntoma es el mismo que el
      # que hizo nacer el vigía —«no cambia nada»—, un nivel más arriba.
      #
      # 🔴 SÓLO EN `salida == 1` (`SALIDA_CANTA`), nunca en `2` (`SALIDA_NO_SUPE_MIRAR`): un
      # vigía ciego no ha medido un problema, y abrir un Issue por ceguera sería la misma
      # confusión —«no sé» tratado como «sí»— que `_vigilante-de-despliegue.mjs` existe para no
      # cometer. Tampoco en `0`: «retrasado pero desplegando» (SCRUM-716) se cierra solo a
      # propósito y avisar ahí es el ruido que bloqueó cinco ramas el 6-sep.
      #
      # 🔴 SIN SECRETO NUEVO. La petición original pedía Jira; no hay ningún secreto de Jira en
      # este repo (comprobado con `gh secret list`: sólo CLAUDE_CODE_OAUTH_TOKEN,
      # SCHEMA_CHECK_SECRET, YAQU_BOT_CLIENT_ID/PRIVATE_KEY), y añadirlo es una decisión de
      # credenciales del fundador (regla de la casa: secretos nunca en el chat, dependencia
      # nueva la decide él), no algo que este ticket pueda simular. Mientras tanto, un GitHub
      # Issue con `GITHUB_TOKEN` —ya concedido arriba— es visible sin abrir Actions y sin pedir
      # nada a nadie. Detalle y el paso siguiente si se quiere Jira: SCRUM-1123.
      #
      # DEDUPE por MARCADOR en el cuerpo (mismo patrón que `avisador-rojo.yml`): si ya hay un
      # Issue ABIERTO con la marca, se comenta con la lectura de HOY en vez de abrir uno nuevo.
      #
      # 🔴 SEGUIMIENTO (26-sep-2026): la DECISIÓN (qué Issue elegir, qué cuerpo componer) vivía
      # entera en bash+jq, intocable por un test — el mismo punto ciego que ya tiene resuelto
      # `scripts/puerta-avisador-rojo.mjs` para el otro avisador de esta casa. Se saca a
      # `scripts/vigia-despliegue-aviso.mjs` (JSON en, JSON fuera, cero red, con tests contra
      # dobles); el `gh api`/`gh issue` que de verdad habla con GitHub se queda aquí, fino.
      # ═══════════════════════════════════════════════════════════════════════════════════════
      - name: Avisar de verdad si el vigía cantó (Issue de GitHub)
        if: always() && steps.vigia.outputs.salida == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARCA: "<!-- vigia-despliegue:produccion-congelada -->"
        run: |
          RENGLON="$(tail -1 .vigia/constancias.log 2>/dev/null || true)"

          # 🔴 NO se usa `gh issue list --search`: la búsqueda de GitHub tokeniza el cuerpo y no
          # garantiza casar un literal con `<!-- … -->`. Se listan los Issues abiertos tal cual
          # (JSON crudo) y la DEDUPE por substring exacto la hace `vigia-despliegue-aviso.mjs`.
          if ! VIGIA_ISSUES_JSON="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate 2>/dev/null)"; then
            VIGIA_ISSUES_JSON='[]'
          fi

          # 🔴 `|| true` en las tres líneas siguientes A PROPÓSITO: los `run:` de Actions llevan
          # `-e -o pipefail`, y sin esto un `jq`/`node` que fallara abortaría el paso ANTES de
          # llegar al `if`/`else` que decide cómo avisar del fallo — el mismo error de "abortar en
          # vez de decidir" que este propio seguimiento viene a evitar en la decisión de arriba.
          DECISION="$(VIGIA_ISSUES_JSON="$VIGIA_ISSUES_JSON" VIGIA_MARCA="$MARCA" VIGIA_RENGLON="$RENGLON" VIGIA_RUN_URL="$RUN_URL" \
                      node scripts/vigia-despliegue-aviso.mjs)" || true
          ACCION="$(printf '%s' "$DECISION" | jq -r '.accion' 2>/dev/null)" || true

          if [ "$ACCION" = "comentar" ]; then
            NUMERO="$(printf '%s' "$DECISION" | jq -r '.numero')"
            printf '%s' "$DECISION" | jq -r '.cuerpo' | gh issue comment "$NUMERO" --repo "$REPO" --body-file -
            echo "- **ACTUALIZADO** — Issue #$NUMERO con la lectura de esta ejecución." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ACCION" = "crear" ]; then
            SALIDA_ISSUE="$(printf '%s' "$DECISION" | jq -r '.cuerpo' \
              | gh issue create --repo "$REPO" --title "🔴 Producción congelada — el vigía del despliegue está en rojo" --body-file - 2>&1)" \
              && echo "- **ABIERTO** — $SALIDA_ISSUE" >> "$GITHUB_STEP_SUMMARY" \
              || { echo "::error::No se pudo abrir el Issue de aviso: $SALIDA_ISSUE"; echo "- **NO SE PUDO ABRIR** — $SALIDA_ISSUE" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          else
            MOTIVO="$(printf '%s' "$DECISION" | jq -r '.motivo // "sin motivo"' 2>/dev/null || echo "sin motivo (DECISION ilegible: $DECISION)")"
            echo "::error::No se pudo decidir el aviso: $MOTIVO"
            echo "- **NO-SE-SABE** — $MOTIVO" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
