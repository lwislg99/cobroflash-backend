# .github/workflows/conflicto-de-registro.yml — SCRUM-839d · fase 2, pieza A
#
# QUÉ HACE: cada vez que `main` avanza, mira los PR `scrum-*` abiertos. Si uno ha quedado en
# conflicto y TODOS sus ficheros en conflicto son `docs/master/*.md`, trae `main` con git por
# línea de comandos —que SÍ respeta `merge=union`— y empuja ese merge a la rama del PR con la
# llave de la App. El PR vuelve a estar limpio, corre CI y el auto-merge hace el resto.
#
# QUÉ NO HACE, Y ES LA MITAD DEL DISEÑO:
#   · 🔴 NO toca un PR que no tuviera el auto-merge ARMADO antes de la pasada (SCRUM-839e). El
#     16-sep-2026 la primera pasada empujó a #880 y #399, PR de semanas sin armar; el push los
#     hizo armar y entraron en `main`. Si no se puede leer el armado, «no pude mirar».
#   · NO toca un PR con UN SOLO fichero en conflicto fuera de `docs/master/`. Eso lo resuelve
#     una persona. La decisión —con sus dos cerraduras— vive en `scripts/conflicto-de-registro.mjs`
#     y la tanda la ejecuta contra repositorios git de verdad.
#   · NO fuerza nunca. El merge es hijo de la cabeza del PR: si la rama se ha movido entre medias,
#     el push se rechaza solo y no se pisa nada.
#   · NO avisa en el PR. El aviso (único por cabeza, con tope) es la pieza B, en otro PR.
#   · NO toca la protección de rama, los checks obligatorios ni el filtro de `pr-automatico.yml`.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# 🔴 POR QUÉ HACE FALTA UN JOB, SI YA ESTÁ LA LÍNEA EN `.gitattributes` — MEDIDO
#
# GitHub NO respeta `merge=union`. El 16-sep-2026 se abrieron dos PR gemelos, #1353 con la regla y
# #1354 sin ella: los dos CONFLICTING. Git por línea de comandos, con las MISMAS ramas: con la
# regla, limpio; sin ella, conflicto. La constancia completa, en `docs/master/SCRUM-839.md`.
#
# 🔴 POR QUÉ LA LLAVE DE LA APP Y NO EL `GITHUB_TOKEN` — MEDIDO
#
# Un push con el `GITHUB_TOKEN` no crea ejecuciones de workflow (medido el 9-sep, #1212: 0
# check-runs). El PR quedaría con una cabeza nueva SIN CI, y el auto-merge esperando para siempre:
# peor que el conflicto, porque ya no parece atascado. Sin llave, este job NO empuja.
#
# ⚠️ RIESGO ABIERTO: el push de la App del 16-sep dejó ejecuciones en `action_required` (0 jobs).
# Se cambió la política de aprobación de Actions; queda por ver en el primer push real de este job.
# Si su CI sale retenido, se PARA y se dice — no se rodea.
# ─────────────────────────────────────────────────────────────────────────────────────────

name: Conflicto de registro

on:
  push:
    branches: [main]
  workflow_dispatch:

# Una pasada detrás de otra, sin cancelar: dos a la vez podrían calcular el mismo merge, y la
# segunda solo vería su push rechazado — pero no hay motivo para provocarlo.
concurrency:
  group: conflicto-de-registro
  cancel-in-progress: false

# Mínimos para el `GITHUB_TOKEN`, que aquí solo LEE. El push va con el token de la App, que trae
# sus propios permisos (Contents: Read and write, medido en SCRUM-828).
permissions:
  contents: read
  pull-requests: read

jobs:
  resolver:
    runs-on: ubuntu-latest
    steps:
      # ── 1 · ¿HAY LLAVE DE LA APP? ─────────────────────────────────────────────────────
      # Mismo patrón que `pr-automatico.yml` y `avisador-rojo.yml`: los secretos se miran por
      # `env`, solo si están vacíos.
      - id: modo
        name: ¿Hay llave de la App?
        env:
          CLIENT_ID: ${{ secrets.YAQU_BOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.YAQU_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "- **SIN-LLAVE** — sin token de App un push no dispara CI: no se empuja nada." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: token
        name: Acuñar token de la GitHub App
        if: steps.modo.outputs.hay == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.YAQU_BOT_CLIENT_ID }}
          private-key: ${{ secrets.YAQU_BOT_PRIVATE_KEY }}

      - name: 🔴 CIEGO — hay secretos pero no acuñan token
        if: steps.modo.outputs.hay == 'true' && steps.token.outcome != 'success'
        run: |
          echo "::error::Los secretos de la App existen pero no acuñan token. No se empuja nada."
          echo "- **CIEGO** — secretos presentes que no acuñan token; no se empujó nada." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # ── 2 · EL ÁRBOL, CON HISTORIA, Y CON LA LLAVE PUESTA ─────────────────────────────
      # El checkout guarda el token de la App como credencial de git: el `git push` de abajo
      # empuja como la App sin que el token aparezca en ninguna orden. `fetch-depth: 0` + el
      # fetch explícito de `main`: el patrón medido de la casa (SCRUM-765).
      - uses: actions/checkout@v4
        if: steps.token.outcome == 'success'
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - name: Traer `main`
        if: steps.token.outcome == 'success'
        run: git fetch --no-tags --prune --no-recurse-submodules origin +refs/heads/main:refs/remotes/origin/main

      # ── 3 · MIRAR CADA PR, DECIDIR, Y EMPUJAR SOLO LO QUE LA DECISIÓN DICE ──────────────
      - name: Resolver los conflictos de solo registro
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          NO_PUDE=0
          SIN_ARMAR=0

          # La identidad del merge: la del bot, para que se vea quién lo hizo.
          ID="$(GH_TOKEN="$APP_TOKEN" gh api "/users/${SLUG}%5Bbot%5D" -q .id 2>/dev/null)" || ID=''
          export GIT_AUTHOR_NAME="${SLUG}[bot]" GIT_COMMITTER_NAME="${SLUG}[bot]"
          export GIT_AUTHOR_EMAIL="${ID:+$ID+}${SLUG}[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          # 🔴 SUELO de la lista de PR: si no se puede leer, no es «no hay ninguno».
          # `autoMergeRequest` se lee AQUÍ, antes de empujar nada: es el «ya estaba armado ANTES de
          # esta pasada» (SCRUM-839e). La decisión lo mira primero y, si falta, no empuja.
          if ! gh pr list --state open --base main --limit 200 \
                 --json number,headRefName,headRefOid,isCrossRepository,autoMergeRequest > prs.json; then
            echo "::error::no pude mirar: no se pudo leer la lista de PR abiertos. No se empuja nada."
            echo "- **NO PUDE MIRAR** — la lista de PR abiertos no se pudo leer." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Solo ramas `scrum-*` de ESTE repositorio. El nombre de rama es texto ajeno: va por
          # fichero y variable, nunca interpolado en el script.
          node -e '
            const prs = require("./prs.json");
            for (const p of prs) {
              if (p.isCrossRepository || !/^scrum-/.test(p.headRefName)) continue;
              console.log([p.number, p.headRefOid, p.headRefName].join("\t"));
            }' > candidatos.tsv
          echo "PR scrum-* abiertos: $(wc -l < candidatos.tsv)"

          # El bucle lee por el descriptor 3, no por stdin: así ninguna orden de dentro (git, node)
          # puede comerse las líneas que quedan.
          while IFS="$(printf '\t')" read -r N SHA RAMA <&3; do
            # La cabeza de verdad: `merge-tree` necesita el commit, no su nombre.
            if ! git fetch --no-tags --quiet origin "pull/$N/head"; then
              echo "::error::#$N: no pude mirar (la cabeza del PR no se pudo traer). No se empuja."
              echo "- #$N · **NO PUDE MIRAR** — la cabeza no se pudo traer." >> "$GITHUB_STEP_SUMMARY"
              NO_PUDE=1
              continue
            fi
            # Se movió entre la lista y el fetch: es una carrera, no una avería. Ese push nuevo no
            # dispara este job; lo mirará la siguiente pasada, cuando `main` vuelva a avanzar.
            if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
              echo "- #$N · **SE MOVIÓ** — la cabeza ya no es \`${SHA:0:8}\`; no se toca en esta pasada." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            V="$(node scripts/conflicto-de-registro.mjs "$N" "$SHA" origin/main prs.json)" || V=''
            ACCION="$(printf '%s' "$V" | node -pe 'try { JSON.parse(require("fs").readFileSync(0,"utf8")).accion } catch { "" }')"
            echo "#$N → ${V:-sin veredicto}"

            case "$ACCION" in
              NADA) ;;
              EMPUJAR)
                COMMIT="$(printf '%s' "$V" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).commit')"
                if git push origin "$COMMIT:refs/heads/$RAMA"; then
                  echo "- #$N · **EMPUJADO** — conflicto solo de registro resuelto con union (\`${COMMIT:0:8}\`)." >> "$GITHUB_STEP_SUMMARY"
                else
                  # Rechazado: la rama se movió entre medias, o la App no puede tocar lo que trae
                  # main (p. ej. `.github/workflows/` sin permiso `workflows`). No se reintenta.
                  echo "::error::#$N: el push del merge fue rechazado. El PR sigue en conflicto."
                  echo "- #$N · **PUSH RECHAZADO** — el PR sigue en conflicto." >> "$GITHUB_STEP_SUMMARY"
                  NO_PUDE=1
                fi
                ;;
              NO-EMPUJA)
                CAUSA="$(printf '%s' "$V" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).causa')"
                if [ "$CAUSA" = "SIN-AUTO-MERGE" ]; then
                  # La mayoría de los PR abiertos: se cuentan en una línea, no uno por uno.
                  SIN_ARMAR=$((SIN_ARMAR + 1))
                else
                  echo "- #$N · **NO SE TOCA** — $(printf '%s' "$V" | node -pe 'const v=JSON.parse(require("fs").readFileSync(0,"utf8")); v.causa + ": " + (v.fuera || v.quedan || []).join(", ")')" >> "$GITHUB_STEP_SUMMARY"
                fi
                ;;
              *)
                echo "::error::#$N: no pude mirar. ${V:-la decisión no dio veredicto}"
                echo "- #$N · **NO PUDE MIRAR** — no se empuja." >> "$GITHUB_STEP_SUMMARY"
                NO_PUDE=1
                ;;
            esac
          done 3< candidatos.tsv

          echo "- **SIN AUTO-MERGE, NO SE TOCAN**: $SIN_ARMAR PR (nadie prometió mergearlos)." >> "$GITHUB_STEP_SUMMARY"

          # Un «no pude mirar» pone el run en rojo: es el instrumento diciendo que no vale, no un
          # PR atascado (eso no falla nunca: lo cuenta el vigía).
          exit "$NO_PUDE"
