# .github/workflows/ci.yml — SCRUM-154
#
# POR QUÉ EXISTE: hasta ahora NADA corría `npm test` sobre un PR, así que todos los guards
# de la casa (SCRUM-55, 87, 96, 98, 113, 124, 152…) solo podían fallar DESPUÉS del merge, ya
# sobre `main`. El fallo no rompía el PR que lo traía: rompía `main` para todo el mundo.
#
# Pasó dos veces con el mismo mecanismo: `scrum106` y `scrum51` se escribieron ANTES de que
# existiera el ratchet de SCRUM-113 y chocaron con él el día que aterrizaron. Y volverá a
# pasar, porque este proyecto crea guards constantemente y trabaja con ramas que viven días
# en varias sesiones a la vez: toda rama viva es, por definición, anterior a cualquier guard
# que se mergee mientras ella existe.
#
# ⚠️ SOLO LO NO GATEADO. Aquí NO se pone `QA_DB_TEST=1` ni `DATABASE_URL_TESTS` (SCRUM-383; era
# `DATABASE_URL_STAGING` hasta el 6-ago-2026):
#   1. Regla 9 — los secretos los pega el fundador en Railway, no viajan a terceros.
#   2. Los tests gateados CREAN Y BORRAN merchants; varios PR a la vez escribiendo en la
#      misma BD de staging no los serializa nadie.
#   3. No hacen falta para esto: los guards estructurales corren sin BD A PROPÓSITO, y son
#      justo los que cazan este tipo de rotura.
# Los gateados siguen corriéndose a mano contra staging al cerrar cada tarea (AA1.3).
name: CI

on:
  pull_request:
    branches: [main]
  # También en push a main: es la red que caza EL CASO QUE ORIGINÓ ESTO. Dos PR verdes por
  # separado pueden dar un `main` rojo al mezclarse — una rama vieja y un guard nuevo pasan
  # cada uno su CI y solo colisionan al juntarse. Sin esto, ese rojo no lo ve nadie.
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecución anterior: la que importa es la última.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + tests (con banco desechable)
    runs-on: ubuntu-latest

    # ⚠️ SCRUM-419 · ESTO NO CONTRADICE EL AVISO DE ARRIBA, Y CONVIENE LEER POR QUÉ.
    #
    # Lo que ese aviso excluye es `QA_DB_TEST` / `DATABASE_URL_TESTS`: la base de STAGING. Sus tres
    # motivos son ciertos y siguen en pie — secretos que no viajan (regla 9), varios PR escribiendo
    # a la vez en la misma base, y que los guards estructurales no la necesitan.
    #
    # **`LIBRO_PG_URL` es otra cosa: un Postgres DESECHABLE que levanta el propio runner.** Ni
    # secreto que compartir, ni base compartida entre PR, ni proveedor externo — el contenedor nace
    # y muere con el job. Ninguno de los tres motivos le aplica.
    #
    # Y sin esto había 7 tests que NO se ejecutaban en NINGÚN merge: los que prueban TENENCIA contra
    # el motor real —que un merchant no vea ni un euro ni una factura del otro— y el cuadre de las
    # tres pantallas al céntimo. La suite decía «0 fallos» exactamente igual (SCRUM-419).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        # 🔴 PUERTO DINÁMICO — SIN MAPEO FIJO. Aquí solo se declara el puerto DEL CONTENEDOR;
        # Docker elige uno libre en el host y el job lo lee de
        # `job.services.postgres.ports['5432']`.
        #
        # Fijar `55432:5432` rompió CI para TODAS las PR (10-ago-2026):
        #   failed to bind host port for 0.0.0.0:55432 … address already in use
        # Un contenedor de una ejecución anterior seguía vivo —en el log aparece «Clean up
        # resources from previous jobs»— o había dos jobs a la vez. **Un número fijo en un entorno
        # compartido choca**, y es la tercera vez que esa familia muerde: la ventana fija de los
        # guards y el nombre fijo del check requerido de `main` eran la misma forma.
        #
        # Y NO se arregla con un `sleep`, un reintento ni un `docker rm` previo: eso ata el arreglo
        # a que la carrera salga bien y vuelve a chocar el día que haya dos PR a la vez. El puerto
        # dinámico **elimina** la colisión en vez de esquivarla.
        #
        # ⚠️ Va con mapeo (y no por alias de red `postgres:5432`) porque este job **no** declara
        # `container:`: corre SOBRE el runner, no dentro de un contenedor, así que no comparte la
        # red de Docker con el servicio. Medido antes de elegir la forma, no supuesto.
        ports:
          - 5432
        # Sin el health-check los pasos arrancan antes de que Postgres acepte conexiones, y el
        # fallo se lee como un test roto en vez de como una base que aún no estaba.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Tope de seguridad: la suite tarda ~30 s. Si algo se queda colgado esperando una red
    # que aquí no existe, se corta pronto en vez de consumir minutos de Actions.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # SCRUM-388 · EL CENSO DE TICKETS NECESITA EL REPOSITORIO ENTERO PARA PODER MIRAR.
          #
          # Por defecto `actions/checkout` clona en SUPERFICIAL y con un solo ref remoto, y con eso
          # el centinela se queda ciego de dos formas distintas:
          #   · `git log origin/main` MUERE con `unknown revision` (status 128) — así se descubrió;
          #   · `for-each-ref` NO muere: devuelve 1 rama de ~90, que se lee igual que «no hay
          #     ninguna». Ésa es la peligrosa, porque una falsa alarma es indistinguible de un
          #     hallazgo real.
          #
          # El censo ya sabe declarar «NO PUDE MEDIR» en vez de inventarse un hallazgo, pero un
          # centinela que se declara no medido en el único sitio donde de verdad corre no es un
          # centinela: saltarse siempre y no existir son lo mismo.
          #
          # Coste medido el 7-ago-2026 en este repo: 1.826 commits, 184 refs, **38 MB de `.git`**.
          # Mismo motivo y misma solución que en `zona-roja.yml`, que ya lo usaba.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # ⚠️ El repo NO pincha la versión de Node en ningún sitio (no hay .nvmrc, ni
          # `engines` en package.json, ni configuración de Railway en el árbol). Se fija 24
          # porque es la de desarrollo, pero eso NO garantiza que sea la de producción: si
          # Railway construye con otra, este CI puede dar verdes o rojos que allí no salen.
          # Unificarlo toca el deploy (prod) → decisión del fundador, fuera de este ticket.
          node-version: '24'
          # SIN `cache: npm` (retirado 27-jul-2026). El paso "Post Run actions/setup-node" —la
          # fase que GUARDA la caché, posterior a los tests— tumbaba el job con exit 1 aunque
          # `npm test` hubiera pasado: un PR quedaba bloqueado por algo que no tiene que ver con
          # su código. Coste de quitarlo: `npm ci` tarda unos segundos más. Beneficio: el rojo
          # del CI vuelve a significar "el código falla".
          #
          # Sospecha de la causa, para quien lo reconsidere: arriba hay `cancel-in-progress:
          # true`; un run cancelado a mitad puede dejar la escritura de caché a medias y hacer
          # fallar el guardado del siguiente. Si algún día se quiere recuperar la caché, mirar
          # eso primero — o fijarla a `push` a main, donde nada se cancela.

      # `npm ci` y no `npm install`: instala EXACTAMENTE el lockfile y falla si package.json
      # y package-lock.json han divergido. En un CI eso es lo que se quiere — reproducir, no
      # resolver.
      - run: npm ci

      # `npm ci` borra node_modules entero, y con él el cliente de Prisma GENERADO
      # (node_modules/.prisma + @prisma/client). Desde SCRUM-238 el `postinstall` de package.json ya
      # lo regenera al instalar (aditivo e idempotente), así que este paso es una RED EXPLÍCITA y
      # redundante: deja el nombre del paso rojo diciendo "cliente de Prisma" si el generate fallara,
      # en vez de que casque `tsc` más abajo con "Cannot find module '@prisma/client'". Solo genera
      # tipos a partir de prisma/schema.prisma: NO toca ninguna base de datos.
      - name: Generar cliente de Prisma
        run: npx prisma generate

      # `npm test` ya hace build por dentro (`"test": "npm run build && node --test ..."`),
      # así que esto compila dos veces. Es a propósito y cuesta segundos: separarlo hace que
      # el nombre del paso rojo diga si fue un error de COMPILACIÓN o un test fallando, sin
      # tener que abrir el log.
      - name: Compilar (tsc)
        run: npm run build

      # SCRUM-419 · el esquema, en el banco desechable. `migrate diff --from-empty` NO toca ninguna
      # base: escribe el DDL a un fichero, y `psql` lo aplica al contenedor. Se evita a propósito
      # `db push`, que es el mecanismo reservado a las bases del proyecto (regla 3).
      #
      # El nombre de la base termina en `_test` porque los propios tests lo EXIGEN antes de tocarla,
      # junto con que el host sea loopback y que no sea ninguna base del proyecto. Ese guard suyo se
      # queda: aquí no se afloja nada, se le da lo que pide.
      # ⚠️ EL PUERTO SE LEE, NO SE ESCRIBE. `job.services.postgres.ports['5432']` es el puerto que
      # Docker asignó en el host para este job. Escribirlo a mano es lo que rompió CI.
      - name: Banco desechable para los tests de libro
        env:
          PGPORT_HOST: ${{ job.services.postgres.ports['5432'] }}
        run: |
          test -n "$PGPORT_HOST" || { echo "🔴 no se pudo leer el puerto del servicio: no se toca ninguna base"; exit 1; }
          echo "banco desechable en 127.0.0.1:$PGPORT_HOST"
          psql "postgresql://postgres@127.0.0.1:$PGPORT_HOST/postgres" -c 'CREATE DATABASE yaqu_libro_test'
          npx prisma migrate diff --from-empty \
            --to-schema-datamodel prisma/schema.prisma --script > "$RUNNER_TEMP/esquema.sql"
          test -s "$RUNNER_TEMP/esquema.sql" || { echo "🔴 el esquema salió VACÍO: no se aplica nada a ciegas"; exit 1; }
          psql "postgresql://postgres@127.0.0.1:$PGPORT_HOST/yaqu_libro_test" -q -f "$RUNNER_TEMP/esquema.sql"

      - name: Tests (incluidos los 7 de banco)
        env:
          LIBRO_PG_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/yaqu_libro_test
          # SCRUM-552 · DOS REPORTERS A LA VEZ, cada uno a su destino.
          #
          # El log sigue siendo `spec` en stdout —4.374 líneas, legible— y el TAP completo va a un
          # fichero que NADIE lee salvo cuando hay rojo. Medido: el TAP en stdout serían 23.136
          # líneas (5,3× más) y un log que nadie puede leer es el mismo problema con otro nombre.
          #
          # 🔴 QUÉ APORTA EL TAP, y es lo que motivó el ticket: cuando un fichero cae A NIVEL DE
          # PROCESO —no en un subtest— `spec` imprime sólo «'test failed'». El TAP añade
          # `exitCode` y `signal`, que es lo único que distingue «salió con error» de «lo mataron»
          # (OOM, timeout) o «crasheó». Reproducido en local: un fichero dio
          # `exitCode: 3221226505` (0xC0000409, aborto del proceso en Windows) donde el log sólo
          # decía «test failed».
          #
          # Va en NODE_OPTIONS y NO en el script `test` a propósito: `pretest`, `test` y sus
          # hermanos llevan su historia en su //comentario y varios se ganaron a base de averías.
          # Comprobado que no rompe el `npm run build` que `npm test` hace por dentro.
          NODE_OPTIONS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=tap --test-reporter-destination=${{ runner.temp }}/tanda.tap
        run: npm test

      # Sólo cuando hay rojo. En verde no imprime nada y no cuesta un segundo.
      - name: Por qué cayó (del TAP, sólo si la tanda falla)
        if: failure()
        run: |
          tap="${{ runner.temp }}/tanda.tap"
          if [ ! -s "$tap" ]; then
            echo "🔴 NO SUPE MIRAR: no hay TAP en $tap, así que el rojo de arriba es lo único que hay."
            echo "   (¿ha cambiado el script \`test\`, o node dejó de aceptar los reporters en NODE_OPTIONS?)"
            exit 0
          fi
          echo "── Lo que cayó, con su motivo ─────────────────────────────────────────"
          echo "   Si el fallo es de un SUBTEST, aquí sale su nombre."
          echo "   Si el fichero cayó a nivel de PROCESO, aquí salen \`exitCode\` y \`signal\`,"
          echo "   que es justo lo que el log de arriba no dice."
          echo
          awk '/^not ok /{p=1} p{print} p&&/^  \.\.\./{p=0}' "$tap"

      # El TAP entero, por si el bloque de arriba no basta. Se sube SIEMPRE que haya rojo:
      # un diagnóstico que hay que pedir a mano llega un día tarde.
      - name: Guardar el TAP completo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tanda-tap
          path: ${{ runner.temp }}/tanda.tap
          retention-days: 7
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # SCRUM-522 · LOS GUARDS DE NAVEGADOR, QUE HASTA HOY NO CORRÍAN EN NINGÚN SITIO
  # ═══════════════════════════════════════════════════════════════════════════════════════
  #
  # Nueve guards levantan un navegador y quedaban FUERA de `npm test` por lentos. Figuraban como
  # cobertura y sólo protegían si alguien se acordaba de lanzarlos: medido, **ninguno corría en
  # CI**, así que un PR podía romper lo que vigilan y mergear en verde.
  #
  # ── POR QUÉ UN JOB APARTE Y NO DENTRO DE `npm test` ────────────────────────────────────────
  # El reparto del coste está MEDIDO (mediana de 5 pasadas, procesos reales): levantar el
  # navegador son 0,96 s — 8,7 s entre los nueve, el **16 %**— y la comprobación el **84 %**. O
  # sea que no había nada que optimizar: había que ponerlos donde protejan.
  # Dentro de la tanda serían ~50 s más en CADA `npm test` local, o un salto por variable que
  # puede llevar meses apagado sin que nadie lo note. Como job propio: corren en cada PR, el bucle
  # local sigue rápido, y su rojo llega **con nombre propio** en vez de confundirse con un test.
  #
  # ── Y POR QUÉ NO CUESTA RELOJ ──────────────────────────────────────────────────────────────
  # GitHub corre los jobs de un workflow EN PARALELO. Éste tarda ~50 s (medido: 49,6 · 50,6 · 54 s
  # en la misma máquina, y 102 s con ella cargada) y el de tests tarda varios minutos entre
  # `npm ci`, Prisma y la suite. El PR no espera más por esto.
  #
  # ⚠️ SIN SECRETOS, igual que el job de arriba y por el mismo motivo (regla 9). Estos nueve
  #    guards sirven sus propias páginas estáticas y no tocan ninguna base: comprobado, ninguno
  #    menciona `DATABASE_URL` ni Prisma.
  guards-visuales:
    name: guards de navegador (fuera de la tanda)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 🔴 RAMA DE MEDICIÓN — NO MERGEAR (SCRUM-626).
    #
    # El log del runner decía «tardó 30.0 s antes de rendirse, con un tope de 30000 ms». Esos
    # 30,0 s SON EL TOPE, no el arranque: puppeteer abandonó al llegar a él. O sea que el
    # arranque en frío real NUNCA SE HA MEDIDO — sólo sabemos que es > 30 s.
    #
    # `topeDeArranque()` (`scripts/_navegador.mjs`) lee esta variable, y su propio comentario
    # dice para qué existe: «lo sube SOLO PARA MEDIR». Esto es exactamente ese uso.
    #
    # ⚠️ ESTO NO PUEDE ENTRAR EN `main`. Un tope de 180 s permanente pondría el CI verde por la
    # razón equivocada: sería relajar el guard con otro nombre. Se empuja para LEER el
    # ⟦arranque⟧ de los tres primeros guards y se tira.
    env:
      NAVEGADOR_TIMEOUT_MS: 180000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # Dos de los nueve —`vias-de-cobro` y `aviso-bizum`— importan de `dist/`, así que sin
      # compilar se caerían por falta de módulo y el rojo diría lo que no es.
      - name: Compilar (tsc)
        run: npm run build

      # 🔴 QUE HAYA NAVEGADOR SE COMPRUEBA ANTES, Y EN VOZ ALTA.
      #
      # La imagen `ubuntu-latest` trae Edge, Chrome y Chromium preinstalados (comprobado en su
      # documentación el 20-ago-2026), y `scripts/_navegador.mjs` los busca por orden. Pero si
      # algún día la imagen deja de traerlos, el fallo tiene que decir ESO y no parecer que los
      # guards no encontraron defectos: el resolutor sale con código 2 declarándose ciego.
      #
      # Se imprime cuál resolvió para que un cambio de la imagen se vea en el log en vez de
      # cambiar el navegador bajo los pies de la medición sin que nadie se entere.
      # ⚠️ Bloque literal (`run: |`) y no escalar plano: el `node -e` lleva dos puntos seguidos de
      #    espacio dentro del mensaje, y en un escalar plano YAML eso se lee como un mapa. El
      #    fichero se rompería, y un workflow que no parsea no falla: NO CORRE.
      - name: Qué navegador hay
        run: |
          node -e "import('./scripts/_navegador.mjs').then(m => { const r = m.resolverNavegador(); if (!r.ok) { console.error('NO SUPE MIRAR'); console.error(r.motivo); process.exit(2); } console.log(r.quien + ' -> ' + r.ruta); })"

      # SCRUM-617 · AQUÍ VIVIÓ UNA MEDIDA TEMPORAL, Y SE HA RETIRADO. Queda escrito para que nadie
      # la vuelva a poner sin saber lo que pasó.
      #
      # Del 24-ago-2026 al 24-ago-2026 este paso llevó `NAVEGADOR_TIMEOUT_MS: '120000'`, para medir
      # por qué `guard-contraste` moría en el runner con «Timed out after 30000 ms while waiting for
      # the WS endpoint URL». El CI pasó en un rerun — **y ese verde NO contesta la pregunta**: con
      # el tope a 120 s es compatible con «arrancó en 40 s» y con «el runner venía caliente y habría
      # pasado con 30 s». Lo único que discrimina es la columna de ARRANQUE que la puerta imprime, y
      # ese log no se ha leído.
      #
      # 🔴 POR QUÉ SE RETIRA IGUALMENTE, sin esperar al log: «lo dejamos hasta que llegue el dato»
      # es la frase que fosiliza una medida temporal. Con el tope a 120 s, un arranque que se cuelgue
      # DE VERDAD tarda cuatro veces más en denunciarse, y como no rompe nada visible nadie lo
      # miraría nunca. Manda otra vez `TOPE_ARRANQUE_POR_DEFECTO` (30 000), que no es un número
      # elegido por nosotros: es el defecto de puppeteer y tiene procedencia.
      #
      # ⚠️ Y NO se sustituye por un valor intermedio (45 s, 60 s): sin el número medido, cualquier
      # constante nueva es una hipótesis disfrazada. El porqué del arranque de `guard-contraste` en
      # CI **QUEDA ABIERTO** — hipótesis A (arranque en frío del runner) en pie y SIN CONFIRMAR.
      # Ver `docs/master/SCRUM-617.md`.
      - name: Guards de navegador
        run: npm run guards:visuales
