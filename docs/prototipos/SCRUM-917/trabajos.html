<style>
/* Tokens: DESIGN.md (única fuente). Los mismos que el prototipo de SCRUM-915. */
:root{
  --brand:#16a34a; --brand-hover:#15803d; --brand-ink:#052e16; --brand-tint:#ecfdf5; --brand-tint-ink:#166534;
  --ink:#0f1c17; --body:#3f4a45; --muted:#6b756f; --bg:#f6f7f5; --surface:#fff; --border:#e7e9e5; --neutral-100:#eef0ec;
  --danger:#dc2626; --warning:#b45309; --warning-bg:#fff7ed; --info:#1d4ed8; --info-bg:#eff6ff;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:9999px;
  --sh-reposo:0 1px 2px rgba(16,24,40,.04);
  --sh-elevado:0 4px 12px -2px rgba(16,24,40,.08),0 2px 6px -2px rgba(16,24,40,.05);
  --sh-flotante:0 18px 40px -12px rgba(16,24,40,.18);
  --sh-foco:0 0 0 3px rgba(34,197,94,.30);
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--body);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--sh-foco)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 18px;border-radius:var(--r-full);border:1px solid transparent;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--body);padding:11px 12px}
.btn-ghost:hover{color:var(--ink);background:var(--neutral-100)}
.btn-sm{min-height:44px;padding:9px 14px;font-size:14px}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.money{font-variant-numeric:tabular-nums}
.propuesto{text-decoration:underline dashed var(--warning) 1.5px;text-underline-offset:3px}
body.sin-resaltar .propuesto{text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-full);font-size:12px;font-weight:700;letter-spacing:.02em}
.pill-agendado{background:var(--info-bg);color:var(--info)}
.pill-encurso{background:#fffbeb;color:#b45309}
.pill-terminado{background:var(--brand-tint);color:var(--brand-tint-ink)}
.pill-pagado{background:var(--brand-tint);color:var(--brand-tint-ink)}
.pill-parcial{background:#fffbeb;color:#b45309}
.pill-cerrado{background:var(--neutral-100);color:var(--muted)}

/* Barra del prototipo (no es producto) */
.proto{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px}
.proto strong{font-size:13px}
.proto button{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:var(--r-full);padding:6px 12px;font-size:13px;cursor:pointer}
.proto button[aria-pressed="true"]{background:rgba(255,255,255,.18);border-color:transparent;font-weight:700}
.proto label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.proto .leyenda{font-size:12px;color:#c9d3ce;width:100%}
.proto .leyenda u{text-decoration:underline dashed #f0b100 1.5px;text-underline-offset:3px}

.marco{max-width:1240px;margin:0 auto;padding:20px 16px 90px}

/* ── LA CABECERA QUE CONTESTA LAS DOS PREGUNTAS ───────────────────────────── */
.titular{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.titular h1{margin:0;font-size:1.6rem;color:var(--ink);letter-spacing:-.02em}
.dosCifras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.cifra{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px 16px;box-shadow:var(--sh-reposo)}
.cifra.dinero{background:var(--brand-tint);border-color:#c9ecd7}
.cifra .n{display:block;font-size:1.6rem;font-weight:800;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.cifra.dinero .n{color:var(--brand-ink)}
.cifra .pie{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}

.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .eur{font-weight:800;font-variant-numeric:tabular-nums}

/* ── LOS GRUPOS Y LAS FILAS ───────────────────────────────────────────────── */
.grupo{margin-bottom:18px}
.grupo-cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px 8px}
.grupo-cab b{color:var(--ink);font-size:15px}
.grupo-cab .cuenta{color:var(--muted);font-size:13.5px}
.grupo-cab .suma{margin-left:auto;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.grupo-cab .salvedad{width:100%;font-size:12.5px;color:var(--warning);margin-top:2px}
.filas{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-reposo)}
.fila{display:grid;grid-template-columns:1fr 210px 150px auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--border);cursor:pointer}
.fila:first-child{border-top:0}
.fila:hover{background:var(--bg)}
.fila .quien b{display:block;color:var(--ink);font-weight:700}
.fila .quien span{display:block;font-size:13px;color:var(--muted)}
.fila .dinero{text-align:right}
.fila .dinero .falta{display:block;font-size:1.0625rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.fila .dinero .falta.cobrado{color:var(--brand-tint-ink);font-size:.95rem}
.fila .dinero .falta.sinimporte{color:var(--muted);font-weight:600;font-size:.95rem}
.fila .dinero .de{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fila .cuando{font-size:13.5px;color:var(--body)}
.fila .cuando .hoy{font-weight:700;color:var(--ink)}
.fila .acciones{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.aviso-celda{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--warning);background:var(--warning-bg);border-radius:var(--r-sm);padding:2px 7px;margin-top:3px}
.kebab{min-width:44px;min-height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted);font-size:17px;line-height:1}
.kebab:hover{background:var(--bg);color:var(--ink)}
.vacio{padding:26px 16px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .dosCifras{grid-template-columns:1fr}
  .fila{grid-template-columns:1fr auto;grid-template-areas:"quien dinero" "cuando cuando" "acc acc";gap:8px 12px;padding:14px 16px}
  .fila .quien{grid-area:quien}
  .fila .dinero{grid-area:dinero}
  .fila .cuando{grid-area:cuando}
  .fila .acciones{grid-area:acc;justify-content:flex-start;margin-top:4px}
  .filas{border-radius:var(--r-lg)}
}

/* ── EL DETALLE ───────────────────────────────────────────────────────────── */
.det{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.migas{font-size:13px;color:var(--muted);margin-bottom:6px}
.migas a{display:inline-flex;align-items:center;min-height:44px;color:var(--brand-tint-ink);text-decoration:none;font-weight:600}
/* La cabecera en DOS columnas en escritorio: sin esto crecía a 186 px, más que los 139 de hoy,
   y una cabecera del rediseño no puede ocupar más que la que viene a arreglar. */
.cab-det{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;box-shadow:var(--sh-reposo);margin-bottom:14px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.cab-det .quien2{min-width:0}
.cab-det h1{margin:0 0 3px;font-size:1.4rem;color:var(--ink);letter-spacing:-.02em}
.cab-det .sub{font-size:13.5px;color:var(--muted)}
.cab-det .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cab-det .acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (max-width:860px){.cab-det{flex-direction:column}.cab-det .acc{width:100%}}
.tarjeta{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-reposo);margin-bottom:14px}
.tarjeta h2{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* El dinero, UNA vez */
.dineroUnico{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dineroUnico .grande{font-size:2rem;font-weight:800;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.dineroUnico .grande.ok{color:var(--brand-tint-ink)}
.dineroUnico .lat{text-align:right;font-size:13.5px;color:var(--muted)}
.dineroUnico .lat b{color:var(--ink);font-variant-numeric:tabular-nums}
.barra{height:8px;background:var(--neutral-100);border-radius:var(--r-full);overflow:hidden;margin-top:12px}
.barra i{display:block;height:100%;background:var(--brand);border-radius:var(--r-full)}

/* Lo que falta por hacer: una línea por hueco, con su enlace */
.huecos{display:flex;flex-direction:column;gap:2px}
.hueco{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border)}
.hueco:first-child{border-top:0}
.hueco .q{color:var(--ink)}
.hueco .q small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.enlace{background:none;border:0;color:var(--brand-tint-ink);font-weight:700;cursor:pointer;min-height:44px;padding:0 6px;text-decoration:none}
.enlace:hover{text-decoration:underline}

/* La lista de documentos */
.doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.doc:first-of-type{border-top:0}
.doc .ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--neutral-100);display:grid;place-items:center;flex:none;font-size:16px}
.doc .q{flex:1;min-width:0}
.doc .q b{display:block;color:var(--ink)}
.doc .q span{display:block;font-size:12.5px;color:var(--muted)}
.doc .imp{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.barra-docs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

/* El bloque plegable del trabajo */
details.plega{border-top:1px solid var(--border)}
details.plega:first-of-type{border-top:0}
details.plega>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 0;min-height:44px;color:var(--ink);font-weight:700}
details.plega>summary::-webkit-details-marker{display:none}
details.plega>summary .chev{color:var(--muted);font-size:11px;width:12px;display:inline-block}
details.plega>summary .val{margin-left:auto;font-weight:400;color:var(--muted);font-size:13.5px;text-align:right}
details.plega .cuerpo{padding:2px 0 14px}
.campo{display:block;margin-bottom:12px}
.campo .label{display:block;margin-bottom:5px}
.campo input,.campo textarea,.campo select{width:100%;min-height:44px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--ink)}
.nota{font-size:13px;color:var(--muted);margin:6px 0 0}

/* El rail */
.rail .bloque{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh-reposo)}
.rail .bloque h3{margin:0 0 9px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rail .bloque b{color:var(--ink)}
.rail .bloque a{display:flex;align-items:center;gap:8px;color:var(--brand-tint-ink);text-decoration:none;font-weight:600;min-height:44px}
.rail .bloque .dim{color:var(--muted);font-size:13px}

@media (max-width:999px){
  .det{grid-template-columns:1fr}
  .rail{order:2}
}

/* Barra inferior de móvil */
.barra-abajo{display:none}
@media (max-width:860px){
  .marco{padding-bottom:104px}
  .barra-abajo{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--sh-flotante);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center}
  .barra-abajo .tot{flex:1;min-width:0}
  .barra-abajo .tot .label{white-space:nowrap}
  .barra-abajo .tot .cifra2{font-size:1.2rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;display:block;line-height:1.15}
  .barra-abajo .btn{flex:none}
}

/* Hojas */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,28,23,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.hoja{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-flotante);width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.hoja-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.hoja-cab h3{margin:0;color:var(--ink);font-size:1.0625rem}
.cerrar{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted)}
.hoja .lista-acc{display:flex;flex-direction:column;gap:8px}
.hoja .lista-acc .btn{width:100%;justify-content:flex-start}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .hoja{border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:92vh;max-width:none}
}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-full);font-weight:600;box-shadow:var(--sh-flotante);max-width:calc(100vw - 32px)}

/* Inventario */
.inv{max-width:1240px;margin:0 auto;padding:24px 16px}
.inv h2{color:var(--ink);margin:0 0 8px}
.inv p{max-width:78ch}
/* A 390 px una tabla de tres columnas no cabe: se desplaza DENTRO de su caja, y la página no.
   Es una tabla de referencia para leer en el ordenador; no se parte en tarjetas a propósito. */
.inv .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.inv table{width:100%;min-width:620px;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);font-size:14px}
.inv th,.inv td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.inv th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.inv .grupo2 td{background:var(--brand-tint);color:var(--brand-ink);font-weight:700}
.inv .mal td:first-child{border-left:3px solid var(--danger)}
</style>
</head>
<body>

<div class="proto">
  <strong>Prototipo · SCRUM-917 · datos de ejemplo tomados de staging, no guarda nada</strong>
  <button data-tab="lista" aria-pressed="true">Lista de Trabajos</button>
  <button data-tab="detalle" aria-pressed="false">Detalle del Trabajo</button>
  <button data-tab="inv" aria-pressed="false">Inventario antes → después</button>
  <label><input type="checkbox" id="resaltar" checked> Resaltar textos nuevos</label>
  <!-- Este conmutador es ANDAMIO, no producto, y por eso vive aquí arriba y no entre los filtros:
       un control del prototipo que se parece a un control de la pantalla enseña una función que
       no existe. Sirve para ver cómo se comporta la lista cuando el equipo está vacío, que es el
       caso de staging y el que hace que la columna de técnicos no informe nunca. -->
  <label><input type="checkbox" id="equipo" checked> Hay equipo dado de alta</label>
  <span class="leyenda"><u>subrayado</u> = texto nuevo, propuesto y sin firmar</span>
</div>

<main id="app"></main>
<div class="barra-abajo" id="barraAbajo"></div>
<div id="capa"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const P = (t) => `<span class="propuesto">${t}</span>`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// `useGrouping:true` a propósito: en es-ES el agrupador se omite por defecto con cuatro cifras
// («1240,00») y el producto sí lo pone («1.240,00 €», fmtMoneyEs). Un prototipo que formatea el
// dinero distinto que la pantalla de al lado enseña una diferencia que no existe.
const eur = (n) => Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true }) + ' €';
const movil = () => window.matchMedia('(max-width:860px)').matches;

// ── LOS DATOS ────────────────────────────────────────────────────────────────
// Salen de la medición de staging del 17-sep-2026 (`inventario-hoy.md`): mismos clientes, mismos
// importes, mismos estados. Se añaden un «en curso» y dos «terminados» que en staging no había,
// porque sin ellos no se puede enseñar el momento del dinero, que es la razón de esta pantalla.
const HOY = new Date(2026, 8, 17);
const J = [
  { id: 1, cliente: 'María López', trabajo: 'Cambio de cuadro eléctrico', estado: 'en_curso', fecha: '2026-09-17T09:00', total: 590, cobrado: 0, tecnicos: ['Miguel Ortiz'] },
  { id: 2, cliente: 'Comunidad Los Olivos', trabajo: 'Revisión anual del portero', estado: 'agendado', fecha: '2026-09-17T16:30', total: 380, cobrado: 190, tecnicos: ['Nadia Ferrer'] },
  { id: 3, cliente: 'SCRUM-883 Cliente recarga VE', trabajo: 'Punto de recarga garaje', estado: 'agendado', fecha: '2026-09-19T08:00', total: 970.23, cobrado: 291.07, tecnicos: [] },
  { id: 4, cliente: 'Lucía Romero', trabajo: '', estado: 'pendiente_agendar', fecha: null, total: 590, cobrado: 0, tecnicos: [] },
  { id: 5, cliente: 'QA 887 C3-A', trabajo: '', estado: 'pendiente_agendar', fecha: null, total: 417.45, cobrado: 0, tecnicos: [] },
  { id: 6, cliente: 'QA 887 C3-A', trabajo: '', estado: 'pendiente_agendar', fecha: null, total: 559.7, cobrado: 0, tecnicos: [] },
  { id: 7, cliente: 'Lucía Romero', trabajo: 'Sustituir termo', estado: 'pendiente_agendar', fecha: null, total: 380, cobrado: 0, tecnicos: [] },
  { id: 8, cliente: 'Taller Hnos. Vega', trabajo: 'Urgencia: sin luz en nave', estado: 'pendiente_agendar', fecha: null, total: null, cobrado: 0, tecnicos: [] },
  { id: 9, cliente: 'SCRUM-883 Cliente electricista', trabajo: 'Legalización de instalación', estado: 'terminado', fecha: '2026-09-11T10:00', total: 539.05, cobrado: 628.6, tecnicos: ['Miguel Ortiz'] },
  // El anticipo NO es la mitad justa a propósito: con 620 de 1.240 «lo cobrado» y «lo que falta»
  // salen iguales por casualidad, y una pantalla que se mide con dos cifras iguales no deja ver
  // si las está repitiendo o si son dos hechos distintos.
  { id: 10, cliente: 'Bar El Puerto', trabajo: 'Cámara frigorífica', estado: 'terminado', fecha: '2026-09-12T12:00', total: 1240, cobrado: 500, tecnicos: ['Miguel Ortiz', 'Nadia Ferrer'] },
  { id: 11, cliente: 'Inmobiliaria Sur', trabajo: 'Certificado de 3 pisos', estado: 'terminado', fecha: '2026-09-09T09:30', total: null, cobrado: 0, tecnicos: [] },
  { id: 12, cliente: 'Hotel Arenal', trabajo: 'Mantenimiento trimestral', estado: 'agendado', fecha: '2026-09-28T09:00', total: 2150, cobrado: 0, tecnicos: ['Nadia Ferrer'] },
  { id: 13, cliente: 'Pilar Ibáñez', trabajo: 'Enchufes cocina', estado: 'cerrado', fecha: '2026-08-30T11:00', total: 145, cobrado: 145, tecnicos: ['Miguel Ortiz'] },
];
// El interruptor que hace honesta la columna de técnicos: en staging el equipo está VACÍO.
let HAY_EQUIPO = true;
let filtro = 'todos';

const falta = (j) => j.total == null ? null : Math.max(0, j.total - j.cobrado);
const cobradoDeMas = (j) => j.total != null && j.cobrado > j.total;
const ejeCobro = (j) => j.total != null && j.total > 0;
const estadoCobro = (j) => !ejeCobro(j) ? null : j.cobrado <= 0 ? 'Pendiente' : (j.cobrado >= j.total ? 'Pagado' : 'Parcial');
const mismoDia = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const fechaCorta = (s) => { const d = new Date(s); return d.toLocaleString('es-ES', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); };

// ── LOS GRUPOS · lo que toca, no el estado de la máquina ─────────────────────
// Se conservan de SCRUM-428 porque son lo único que hoy jerarquiza la lista, y con ellos la regla
// nueva: si la fila vive bajo una cabecera que ya dice su estado, la fila NO lo repite.
function grupos() {
  const en7 = new Date(HOY.getTime() + 7 * 86400000);
  const g = [
    { k: 'curso', t: '🔨 En curso', items: [] },
    { k: 'hoy', t: '📅 Hoy', items: [] },
    { k: 'semana', t: '📅 Esta semana', items: [] },
    { k: 'sin', t: '⏳ Sin agendar', items: [] },
    { k: 'adelante', t: '🗓 Más adelante', items: [] },
    { k: 'terminado', t: '✅ Terminados — cobra el resto', items: [], dinero: true },
    { k: 'cerrado', t: '🔒 Cerrados', items: [], plegado: true },
  ];
  for (const j of J.filter(pasaFiltro)) {
    const d = j.fecha ? new Date(j.fecha) : null;
    if (j.estado === 'en_curso') g[0].items.push(j);
    else if (j.estado === 'terminado') g[5].items.push(j);
    else if (j.estado === 'cerrado') g[6].items.push(j);
    else if (d && mismoDia(d, HOY)) g[1].items.push(j);
    else if (d && d <= en7) g[2].items.push(j);
    else if (j.estado === 'pendiente_agendar') g[3].items.push(j);
    else g[4].items.push(j);
  }
  return g;
}
function pasaFiltro(j) {
  if (filtro === 'todos') return true;
  return estadoCobro(j) === filtro;
}

// La acción que toca, por estado. La MISMA escalera de hoy (jobNextAction): aquí sólo cambia
// cuánto pesa en pantalla, no cuál es.
function accion(j) {
  if (j.estado === 'terminado' && falta(j) > 0) return { t: `💰 Cobrar el resto · ${eur(falta(j))}`, peso: 'primary' };
  if (j.estado === 'pendiente_agendar') return { t: 'Agendar', peso: 'secondary' };
  if (j.estado === 'agendado') return { t: '▶ Empezar', peso: 'secondary' };
  if (j.estado === 'en_curso') return { t: '✅ Marcar terminado', peso: 'secondary' };
  return null;
}

// ── PANTALLA 1 · LA LISTA ────────────────────────────────────────────────────

  const cuentas = { todos: J.length, Pendiente: 0, Parcial: 0, Pagado: 0 };

  const gs = grupos();

      <div class="cifra dinero"><span class="label">${P('Por cobrar')}</span><b class="n money">${eur(porCobrar)}</b>
        <span class="pie">${P('en ' + vivos.filter((j) => falta(j) > 0).length + ' trabajos sin cerrar')}${sinImporte ? ' · ' + P(sinImporte + ' sin importe de referencia, no entran') : ''}</span></div>
    </div>

    <div class="filtros">

        `<button class="chip" data-filtro="${k}" aria-pressed="${filtro === k}">${n} · ${k === 'todos' ? cuentas.todos : cuentas[k]}</button>`).join('')}
    </div>

    ${gs.filter((g) => g.items.length).map(pintarGrupo).join('') || `<div class="filas"><div class="vacio">${P('No hay trabajos con ese filtro.')}</div></div>`}
  </div>`;
  $('#barraAbajo').innerHTML = `<div class="tot"><span class="label">${P('Por cobrar')}</span><span class="cifra2 money">${eur(porCobrar)}</span></div>
    <button class="btn btn-primary btn-sm">Nuevo trabajo</button>`;

function pintarGrupo(g) {
  const suma = g.items.reduce((a, j) => a + (falta(j) || 0), 0);
  const sinRef = g.items.filter((j) => j.total == null).length;
  return `<section class="grupo">
    <div class="grupo-cab"><b>${g.t}</b><span class="cuenta">${g.items.length}</span>
      ${g.dinero && suma > 0 ? `<span class="suma money">${eur(suma)} ${P('por cobrar')}</span>` : ''}
      ${g.dinero && sinRef ? `<span class="salvedad">${sinRef} sin importe de referencia: no se sabe cuánto falta y no entran en el total.</span>` : ''}</div>
    <div class="filas">${g.items.map((j) => fila(j, g)).join('')}</div>
  </section>`;
}

function fila(j, g) {
  const f = falta(j);
  const a = accion(j);
  // 🔴 LA FILA NO REPITE LO QUE DICE SU CABECERA. Bajo «⏳ Sin agendar» no se pinta la píldora
  // «SIN AGENDAR», que hoy sale en 12 de 13 filas diciendo lo que el grupo ya dijo tres píxeles
  // más arriba. Lo que se pinta en «Cuándo» es la fecha, o nada.
  const cuando = j.fecha
    ? `<span class="${mismoDia(new Date(j.fecha), HOY) ? 'hoy' : ''}">${fechaCorta(j.fecha)}</span>`
    : '';
  // 🔴 LA COLUMNA DE TÉCNICOS DESAPARECE COMO COLUMNA. Baja a la línea del cliente, y sólo si hay
  // equipo: con el equipo vacío decía «Sin asignar» en 13 de 13 filas. Ausente ≠ cero (SCRUM-651).
  const segundaLinea = [esc(j.trabajo), HAY_EQUIPO ? (j.tecnicos.length ? esc(j.tecnicos.join(', ')) : P('Sin asignar')) : '']
    .filter(Boolean).join(' · '); // `filter(Boolean)` va ANTES del join: si no, con el trabajo sin
                                  // nombre o sin equipo quedaba un « · » colgando al final de la línea.
  return `<div class="fila" data-abrir="${j.id}">
    <div class="quien"><b>${esc(j.cliente)}</b>${segundaLinea ? `<span>${segundaLinea}</span>` : ''}</div>
    <div class="dinero">${pintarDinero(j, f)}</div>
    <div class="cuando">${cuando}</div>
    <div class="acciones">
      ${a ? `<button class="btn btn-${a.peso} btn-sm" data-accion="fila">${a.t}</button>` : ''}
      <button class="kebab" data-mas="${j.id}" aria-label="Más acciones de ${esc(j.cliente)}">⋯</button>
    </div>
  </div>`;
}

// 🔴 LA CIFRA GRANDE PASA A SER LO QUE FALTA. Hoy la grande es el total del presupuesto y lo que
// falta va debajo, pequeño, y dicho al revés («0,00 € de 417,45 €» obliga a restar). La pregunta
// del jefe es cuánto le deben.
function pintarDinero(j, f) {
  if (j.total == null) return `<span class="falta sinimporte">${P('Sin importe')}</span><span class="de">${P('no hay presupuesto aceptado')}</span>`;
  if (cobradoDeMas(j)) {
    // Dos números que se contradicen. Hoy se enseñan mudos; aquí se nombran.
    return `<span class="falta money">${eur(0)}</span><span class="de">${P('cobrado ' + eur(j.cobrado) + ' de ' + eur(j.total))}</span>
      <span class="aviso-celda">⚠︎ ${P('cobrado de más · ' + eur(j.cobrado - j.total))}</span>`;
  }
  if (f === 0) return `<span class="falta cobrado">✓ ${P('Cobrado')}</span><span class="de money">${eur(j.total)}</span>`;
  return `<span class="falta money">${eur(f)}</span><span class="de">${P('de ' + eur(j.total))}</span>`;
}

            ${botonPrincipal(j, f)}
            <button class="btn btn-secondary btn-sm" data-accion="gasto">+ Añadir gasto</button>

        <!-- 🔴 EL DINERO SE DICE UNA VEZ. Hoy «590,00 €» sale siete veces en esta pantalla: como

    ${a ? `<button class="btn btn-primary btn-sm" data-accion="principal">${a.t.replace(/ · .*$/, '')}</button>` : ''}`;

function pintarHueco(h) {
  return `<div class="hueco"><div class="q">${h.q}${h.s ? `<small>${h.s}</small>` : ''}</div>
    <div style="display:flex;align-items:center;gap:12px">${h.v ? `<b class="money">${h.v}</b>` : ''}<button class="enlace">${P(h.b)}</button></div></div>`;
}
function plegable(k, titulo, valor, cuerpo) {
  return `<details class="plega"><summary><span class="chev">▸</span>${titulo}<span class="val">${valor}</span></summary><div class="cuerpo">${cuerpo}</div></details>`;
}
function pillEstado(j) {
  const m = { en_curso: ['pill-encurso', 'En curso'], agendado: ['pill-agendado', 'Agendado'], terminado: ['pill-terminado', 'Terminado'], pendiente_agendar: ['pill-cerrado', 'Sin agendar'], cerrado: ['pill-cerrado', 'Cerrado'] }[j.estado];
  return `<span class="pill ${m[0]}">${m[1]}</span>`;
}
function botonPrincipal(j, f) {
  const a = accion(j);
  if (!a) return '';
  return `<button class="btn btn-${a.peso === 'primary' ? 'primary' : 'primary'} btn-sm" data-accion="principal">${a.t}</button>`;
}
function documentos(j) {
  const filas = [
    { i: '📝', t: `Presupuesto #${j.id}`, s: 'Aceptado · 16 sept 2026, 10:12', m: j.total == null ? null : j.total },
  ];
  if (j.estado === 'terminado' || j.estado === 'cerrado') filas.push({ i: '📦', t: 'Albarán AB260012', s: 'Firmado · 12 sept 2026, 13:40', m: j.total });
  if (j.cobrado > 0) filas.push({ i: '🧾', t: 'Factura 2026-CF-0041', s: 'Pagada · 13 sept 2026, 09:02', m: j.cobrado });
  if (!filas.length) return `<p class="nota">Aún no hay documentos. Crea un albarán por cada visita o entrega.</p>`;
  return filas.map((d) => `<div class="doc"><div class="ico">${d.i}</div><div class="q"><b>${d.t}</b><span>${d.s}</span></div>
    ${d.m == null ? '' : `<span class="imp money">${eur(d.m)}</span>`}<button class="kebab" aria-label="Acciones de ${d.t}">⋯</button></div>`).join('');
}

    <h2>Inventario · lo que hay hoy → lo que propone el prototipo</h2>
    <p>La columna de la izquierda está <b>medida en staging el 17-sep-2026</b> sobre <code>963c2732</code>, a 1280 y a 390 px
    (las cuentas enteras, en <code>inventario-hoy.md</code>). Nada se retira sin decir por qué, y lo que está decidido con
    su motivo escrito se conserva aunque se vea distinto. Las filas con el borde rojo son las tres cosas que están
    <b>mal decididas</b>, no mal presentadas.</p>
    <div class="scroller"><table><thead><tr><th style="width:34%">Hoy</th><th style="width:36%">Propuesto</th><th>Por qué</th></tr></thead><tbody>
    ${INV.map((r) => r.length === 1
      ? `<tr class="grupo2"><td colspan="3">${r[0]}</td></tr>`
      : `<tr class="${/^🔴/.test(r[2]) ? 'mal' : ''}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
    </tbody></table></div>
    <p style="margin-top:14px"><b>${INV.filter((r) => r.length > 1).length} filas</b> en ${INV.filter((r) => r.length === 1).length} grupos.</p>
  </div>`;
  $('#barraAbajo').innerHTML = '';
}

// ── El conmutador y los gestos ───────────────────────────────────────────────
let tab = 'lista';
function render() {
  document.querySelectorAll('.proto [data-tab]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  if (tab === 'lista') pintarLista(); else if (tab === 'detalle') pintarDetalle(); else pintarInv();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-tab-ir],[data-filtro],[data-equipo],[data-abrir],[data-mas],[data-accion],[data-cerrar]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
  if (t.dataset.tabIr) { e.preventDefault(); tab = t.dataset.tabIr; render(); return; }
  if (t.dataset.filtro) { filtro = t.dataset.filtro; render(); return; }
  if (t.hasAttribute('data-equipo')) { HAY_EQUIPO = !HAY_EQUIPO; render(); return; }
  if (t.dataset.mas) { e.stopPropagation(); hojaMas(Number(t.dataset.mas)); return; }
  if (t.dataset.cerrar != null) { $('#capa').innerHTML = ''; return; }
  if (t.dataset.accion) { e.stopPropagation(); $('#capa').innerHTML = ''; toast('En el prototipo esta acción no hace nada.'); return; }
  if (t.dataset.abrir) { abierto = Number(t.dataset.abrir); tab = 'detalle'; render(); }
});
function hojaMas(id) {
  const j = J.find((x) => x.id === id);
  const op = ['Técnicos'];
  if (j.estado === 'pendiente_agendar') op.push('Agendar');
  if (j.estado === 'agendado') op.push('Reagendar', '▶ Empezar', '📆 Añadir a mi calendario');
  if (j.estado === 'en_curso') op.push('✅ Marcar terminado');
  if (j.estado === 'terminado') op.push('Cerrar trabajo');
  $('#capa').innerHTML = `<div class="overlay" data-cerrar><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="ht" onclick="event.stopPropagation()">
    <div class="hoja-cab"><h3 id="ht">${esc(j.trabajo || j.cliente)}</h3><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <div class="lista-acc">${op.map((o) => `<button class="btn btn-secondary" data-accion="mas">${o}</button>`).join('')}</div></div></div>`;
}
function toast(m) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
$('#resaltar').addEventListener('change', (e) => document.body.classList.toggle('sin-resaltar', !e.target.checked));
$('#equipo').addEventListener('change', (e) => { HAY_EQUIPO = e.target.checked; render(); });
render();
</script>
