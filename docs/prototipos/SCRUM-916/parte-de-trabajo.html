<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parte de trabajo · prototipo</title>
<meta name="description" content="Prototipo del parte de trabajo (SCRUM-916), pensado para el técnico de pie en la obra: primero lo que ha hecho, después horas con selector, y la firma a la vista. Datos de ejemplo; no guarda nada.">
<style>
:root{
  --brand:#16a34a; --brand-hover:#15803d; --brand-ink:#052e16; --brand-tint:#ecfdf5; --brand-tint-ink:#166534;
  --ink:#0f1c17; --body:#3f4a45; --muted:#6b756f; --bg:#f6f7f5; --surface:#fff; --border:#e7e9e5; --neutral-100:#eef0ec;
  --danger:#dc2626; --warning:#b45309; --warning-bg:#fff7ed; --info:#1d4ed8; --info-bg:#eff6ff;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:9999px;
  --sh-reposo:0 1px 2px rgba(16,24,40,.04);
  --sh-elevado:0 4px 12px -2px rgba(16,24,40,.08),0 2px 6px -2px rgba(16,24,40,.05);
  --sh-flotante:0 18px 40px -12px rgba(16,24,40,.18);
  --sh-foco:0 0 0 3px rgba(34,197,94,.30);
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--body);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--sh-foco)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:var(--r-full);border:1px solid transparent;font-weight:700;cursor:pointer}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover)}
.btn-primary[disabled]{background:var(--neutral-100);color:var(--muted);cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--body)}
.btn-ghost:hover{color:var(--ink);background:var(--neutral-100)}
.btn-ancho{width:100%}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.propuesto{text-decoration:underline dashed var(--warning) 1.5px;text-underline-offset:3px}
body.sin-resaltar .propuesto{text-decoration:none}
.nota{font-size:13px;color:var(--muted);margin:6px 0 0}

.proto{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px}
.proto strong{font-size:13px}
.proto button{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:var(--r-full);padding:6px 12px;font-size:13px;cursor:pointer}
.proto button[aria-pressed="true"]{background:rgba(255,255,255,.18);border-color:transparent;font-weight:700}
.proto label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.proto .leyenda{font-size:12px;color:#c9d3ce;width:100%}
.proto .leyenda u{text-decoration:underline dashed #f0b100 1.5px;text-underline-offset:3px}

.marco{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cab h1{margin:0;font-size:1.3rem;color:var(--ink);letter-spacing:-.02em}
.cab .sub{font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-full);font-size:12px;font-weight:700}
.pill-borrador{background:var(--neutral-100);color:var(--muted)}
.pill-sinred{background:var(--warning-bg);color:var(--warning)}

/* Los tres pasos, en el orden en que se hace el trabajo */
.paso{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:var(--sh-reposo)}
.paso>h2{margin:0 0 4px;font-size:1.0625rem;color:var(--ink);display:flex;align-items:center;gap:9px}
.paso>h2 .n{width:26px;height:26px;border-radius:50%;background:var(--brand-tint);color:var(--brand-tint-ink);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.paso .guia{font-size:13.5px;color:var(--muted);margin:0 0 13px 35px}

/* ① Dictado */
.dictado{border:1.5px dashed var(--border);border-radius:var(--r-md);padding:14px;text-align:center;background:var(--bg)}
.dictado.grabando{border-color:var(--brand);border-style:solid;background:var(--brand-tint)}
.micro{width:76px;height:76px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:30px;cursor:pointer;box-shadow:var(--sh-elevado)}
.micro:hover{background:var(--brand-hover)}
.dictado.grabando .micro{background:var(--danger)}
.dictado .pie{font-size:13.5px;color:var(--muted);margin-top:10px}
.oescribe{display:flex;align-items:center;gap:10px;margin:13px 0 8px;color:var(--muted);font-size:13px}
.oescribe::before,.oescribe::after{content:"";flex:1;height:1px;background:var(--border)}
.textarea{width:100%;min-height:96px;padding:12px 13px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--ink);resize:vertical}
.textarea:focus{border-color:var(--brand);box-shadow:var(--sh-foco);outline:none}

/* Las líneas que propone la IA: la voz propone, el humano corrige */
.propuestas{margin-top:14px;border-top:1px solid var(--border);padding-top:13px}
.sug{display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer;margin-top:8px;min-height:48px}
.sug input{width:22px;height:22px;margin-top:2px;accent-color:var(--brand);flex:none}
.sug .q{flex:1;min-width:0}
.sug .q b{display:block;color:var(--ink)}
.sug .q span{display:block;font-size:12.5px;color:var(--muted)}
.sug .uds{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.grupoSug{margin-top:12px}
.grupoSug>.label{display:block;margin-bottom:2px}

/* ② Horas, con selector de verdad */
.horas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campo{display:block}
.campo>.label{display:block;margin-bottom:5px}
.campo input,.campo select{width:100%;min-height:48px;padding:12px 13px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.campo input:focus,.campo select:focus{border-color:var(--brand);box-shadow:var(--sh-foco);outline:none}
.conUnidad{display:flex;align-items:center;gap:8px}
.conUnidad input{max-width:130px}
.conUnidad .u{color:var(--muted);font-size:14px;white-space:nowrap}
.ahora{margin-top:7px}
.ahora button{min-height:44px;padding:8px 13px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;font-size:14px}
.ahora button:hover{background:var(--bg)}
.duracion{margin-top:12px;background:var(--brand-tint);border-radius:var(--r-md);padding:11px 13px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.duracion b{font-size:1.25rem;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.duracion.mal{background:var(--warning-bg)}
.duracion.mal b{color:var(--warning)}

/* ③ Firmas */
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.firma{border:1.5px dashed var(--border);border-radius:var(--r-md);padding:14px;text-align:center;background:var(--bg)}
.firma.hecha{border-style:solid;border-color:var(--brand);background:var(--brand-tint)}
.firma .quien{font-weight:700;color:var(--ink);display:block;margin-bottom:8px}
.firma .est{font-size:12.5px;color:var(--muted);display:block;margin-top:8px}
.firma.hecha .est{color:var(--brand-tint-ink)}

/* Lo demás, recogido */
details.plega{border-top:1px solid var(--border)}
details.plega:first-of-type{border-top:0}
details.plega>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 0;min-height:48px;color:var(--ink);font-weight:700}
details.plega>summary::-webkit-details-marker{display:none}
details.plega>summary .chev{color:var(--muted);font-size:11px;width:12px;display:inline-block}
details.plega>summary .val{margin-left:auto;font-weight:400;color:var(--muted);font-size:13.5px;text-align:right}
details.plega .cuerpo{padding:2px 0 14px;display:grid;gap:12px}
.fichas{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:48px;padding:10px 16px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-ink)}

.aviso{display:flex;gap:9px;align-items:flex-start;background:var(--warning-bg);border-radius:var(--r-md);padding:11px 13px;color:var(--warning);font-size:13.5px;margin-bottom:14px}

.barra-abajo{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--sh-flotante);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center}
.barra-abajo .tot{flex:1;min-width:0}
.barra-abajo .tot .cifra{display:block;font-weight:800;color:var(--ink);line-height:1.2}
.barra-abajo .btn{flex:none}

@media (max-width:640px){
  .horas{grid-template-columns:1fr}
  .firmas{grid-template-columns:1fr}
}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,28,23,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.hoja{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-flotante);width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.hoja-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.hoja-cab h3{margin:0;color:var(--ink);font-size:1.0625rem}
.cerrar{width:48px;height:48px;border-radius:50%;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted)}
.pad{height:170px;border:1.5px dashed var(--border);border-radius:var(--r-md);background:var(--bg);display:grid;place-items:center;color:var(--muted);margin:12px 0}
@media (max-width:640px){.overlay{align-items:flex-end;padding:0}.hoja{border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:92vh;max-width:none}}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-full);font-weight:600;box-shadow:var(--sh-flotante);max-width:calc(100vw - 32px)}

.inv{max-width:1240px;margin:0 auto;padding:24px 16px 90px}
.inv h2{color:var(--ink);margin:0 0 8px}
.inv p{max-width:78ch}
.inv .scroller{overflow-x:auto}
.inv table{width:100%;min-width:620px;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);font-size:14px}
.inv th,.inv td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.inv th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.inv .grupo2 td{background:var(--brand-tint);color:var(--brand-ink);font-weight:700}
</style>
</head>
<body>

<div class="proto">
  <strong>Prototipo · SCRUM-916 · datos de ejemplo, no guarda nada</strong>
  <button data-tab="parte" aria-pressed="true">Parte de trabajo</button>
  <button data-tab="inv" aria-pressed="false">Inventario antes → después</button>
  <label><input type="checkbox" id="resaltar" checked> Resaltar textos nuevos</label>
  <!-- Andamio, no producto: para ver el parte tal como se comporta sin cobertura, que es la mitad
       de los casos reales y donde vive la firma encolada de SCRUM-890/919. -->
  <label><input type="checkbox" id="sinred"> Simular sin cobertura</label>
  <span class="leyenda"><u>subrayado</u> = texto nuevo, propuesto y sin firmar</span>
</div>

<main id="app"></main>
<div class="barra-abajo" id="barraAbajo"></div>
<div id="capa"></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const P = (t) => `<span class="propuesto">${t}</span>`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let tab = 'parte';
let sinRed = false;
const S = {
  num: 'PT-2026-007', cliente: 'Lucía Romero', trabajo: 'Cámara frigorífica',
  texto: '', ordenado: false, grabando: false,
  manoObra: [], materiales: [],
  entrada: '', salida: '', desplazamiento: '', km: '',
  direccion: '', ref: '', tecnicos: '', tipo: '', notas: '',
  firmaCliente: null, firmaTecnico: null,
  colaSinRed: 0,
};

// Lo que «entendería» la IA de un dictado. En el producto lo hace la IA gratuita de SCRUM-912 sobre
// el texto; el audio NO sale del móvil (Web Speech API del navegador, SCRUM-71).
const DICTADO_EJEMPLO = 'He estado tres horas y media cambiando el compresor de la cámara. He puesto un compresor nuevo y dos metros de tubo de cobre. He tenido que ir a por el material, unos veinte kilómetros.';
const PROPUESTAS = {
  manoObra: [{ q: 3.5, c: 'Mano de obra · cambio de compresor', d: 'de lo que has dictado: «tres horas y media»' }],
  materiales: [
    { q: 1, c: 'Compresor', d: 'de lo que has dictado: «un compresor nuevo»' },
    { q: 2, c: 'Tubo de cobre (m)', d: 'de lo que has dictado: «dos metros de tubo de cobre»' },
  ],
  km: 20,
};

const hhmm = (s) => /^\d{2}:\d{2}$/.test(s) ? s : '';
function duracion() {
  const a = hhmm(S.entrada), b = hhmm(S.salida);
  if (!a || !b) return null;
  const min = (x) => Number(x.slice(0, 2)) * 60 + Number(x.slice(3, 5));
  const d = min(b) - min(a);
  return d;
}
const enHoras = (min) => {
  const h = Math.floor(Math.abs(min) / 60), m = Math.abs(min) % 60;
  return (h ? h + ' h' : '') + (h && m ? ' ' : '') + (m ? m + ' min' : (h ? '' : '0 min'));
};

function pintar() {
  document.querySelectorAll('.proto [data-tab]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  if (tab === 'inv') { pintarInv(); return; }

  const d = duracion();
  const lineas = S.manoObra.length + S.materiales.length;
  const listo = lineas > 0 && hhmm(S.entrada) && hhmm(S.salida) && d > 0;

  $('#app').innerHTML = `<div class="marco">
    <div class="cab">
      <div><h1>${S.num}</h1><div class="sub">${esc(S.cliente)} · ${esc(S.trabajo)}</div></div>
      <div>${S.firmaCliente && S.firmaTecnico ? `<span class="pill pill-borrador">${P('Firmado')}</span>` : `<span class="pill pill-borrador">${P('Sin cerrar')}</span>`}
        ${sinRed ? `<span class="pill pill-sinred">${P('Sin cobertura')}</span>` : ''}</div>
    </div>

    ${sinRed ? `<div class="aviso"><span>📶</span><div>Sin cobertura. Ves lo que ya tenías en el móvil; lo demás se cargará cuando vuelva la conexión.${S.colaSinRed ? ` <b>${S.colaSinRed} ${S.colaSinRed === 1 ? 'firma guardada' : 'firmas guardadas'} en este móvil.</b>` : ''}</div></div>` : ''}

    <!-- ① PRIMERO LO QUE HA HECHO. Hoy esto es el séptimo bloque de la pantalla, después de siete
         cajas administrativas idénticas. Es lo único que el técnico no puede rellenar nadie por él. -->
    <section class="paso">
      <h2><span class="n">1</span>${P('¿Qué has hecho?')}</h2>
      <p class="guia">${P('Cuéntalo como se lo contarías a un compañero. Lo ordenamos en líneas y tú lo corriges.')}</p>
      <div class="dictado ${S.grabando ? 'grabando' : ''}">
        <button class="micro" data-accion="dictar" aria-label="${S.grabando ? 'Parar de dictar' : 'Dictar lo que has hecho'}">${S.grabando ? '■' : '🎤'}</button>
        <div class="pie">${S.grabando ? P('Escuchando… toca para parar.') : P('Toca y habla. No hace falta que sea ordenado.')}</div>
      </div>
      <div class="oescribe">${P('o escríbelo')}</div>
      <textarea class="textarea" id="txt" placeholder="${P('Por ejemplo: he estado tres horas cambiando el compresor y he puesto dos metros de tubo.')}">${esc(S.texto)}</textarea>
      <button class="btn btn-primary btn-ancho" style="margin-top:10px" data-accion="ordenar" ${S.texto.trim() ? '' : 'disabled'}>Ordenar en líneas</button>
      ${S.ordenado ? propuestas() : ''}
    </section>

    <!-- ② HORAS CON SELECTOR DE VERDAD. Hoy Entrada y Salida son type="text": ni teclado numérico,
         ni formato, ni nadie comprueba que la salida sea después de la entrada. -->
    <section class="paso">
      <h2><span class="n">2</span>${P('Horas y desplazamiento')}</h2>
      <p class="guia">${P('La hora se elige, no se escribe.')}</p>
      <div class="horas">
        <label class="campo"><span class="label">Entrada</span>
          <input type="time" data-c="entrada" value="${esc(S.entrada)}" aria-label="Hora de entrada">
          <div class="ahora"><button data-ahora="entrada">${P('Ahora')}</button></div></label>
        <label class="campo"><span class="label">Salida</span>
          <input type="time" data-c="salida" value="${esc(S.salida)}" aria-label="Hora de salida">
          <div class="ahora"><button data-ahora="salida">${P('Ahora')}</button></div></label>
      </div>
      ${d === null ? '' : d > 0
        ? `<div class="duracion"><span class="label">${P('Tiempo en la obra')}</span><b>${enHoras(d)}</b></div>`
        : `<div class="duracion mal"><span class="label">${P('Revisa las horas')}</span><b>${P('La salida es antes que la entrada')}</b></div>`}
      <div class="horas" style="margin-top:14px">
        <label class="campo"><span class="label">Desplazamiento</span>
          <div class="conUnidad"><input type="number" inputmode="decimal" min="0" step="0.25" data-c="desplazamiento" value="${esc(S.desplazamiento)}" aria-label="Desplazamiento en horas"><span class="u">${P('horas')}</span></div></label>
        <label class="campo"><span class="label">Kilómetros</span>
          <div class="conUnidad"><input type="number" inputmode="numeric" min="0" data-c="km" value="${esc(S.km)}" aria-label="Kilómetros"><span class="u">${P('km')}</span></div></label>
      </div>
    </section>

    <!-- ③ LA FIRMA, A LA VISTA. Hoy queda al final de 1.738 px: más de dos pantallas de móvil. -->
    <section class="paso">
      <h2><span class="n">3</span>${P('Firmas')}</h2>
      <p class="guia">${P('Sin las dos firmas el parte no se cierra.')}</p>
      <div class="firmas">
        ${caja('cliente', 'Firma del cliente', S.firmaCliente)}
        ${caja('tecnico', 'Firma del técnico', S.firmaTecnico)}
      </div>
    </section>

    <!-- LO DEMÁS, RECOGIDO. Son los seis campos administrativos que hoy ocupan la primera pantalla
         entera, todos del mismo tamaño y todos antes que el trabajo. -->
    <section class="paso">
      <h2 style="font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">${P('Datos del parte')}</h2>
      ${plega('obra', P('Obra y referencia'), S.direccion || S.ref ? esc([S.direccion, S.ref].filter(Boolean).join(' · ')) : P('Los del trabajo'),
        `<label class="campo"><span class="label">Dirección de la obra</span><input type="text" data-c="direccion" value="${esc(S.direccion)}" placeholder="${P('La del trabajo, si no pones otra')}"></label>
         <label class="campo"><span class="label">REF</span><input type="text" data-c="ref" value="${esc(S.ref)}" placeholder="${P('Tu referencia interna, si usas alguna')}"></label>`)}
      ${plega('tipo', 'Tipo de intervención', S.tipo ? esc(S.tipo) : P('Sin elegir'),
        `<div class="fichas">${['Reparación / asistencia', 'Mantenimiento', 'Instalación'].map((t) => `<button class="chip" data-tipo="${esc(t)}" aria-pressed="${S.tipo === t}">${t}</button>`).join('')}</div>`)}
      ${plega('tec', 'Técnicos', S.tecnicos ? esc(S.tecnicos) : P('Solo tú'),
        `<label class="campo"><span class="label">Técnicos</span><input type="text" data-c="tecnicos" value="${esc(S.tecnicos)}" placeholder="${P('Quién más ha estado en la obra')}"></label>`)}
      ${plega('notas', 'Notas', S.notas ? esc(S.notas.slice(0, 28)) : P('Sin notas'),
        `<label class="campo"><span class="label">Notas</span><textarea class="textarea" data-c="notas" rows="2" placeholder="${P('Lo que haya que dejar dicho.')}">${esc(S.notas)}</textarea></label>`)}
    </section>
  </div>`;

  $('#barraAbajo').innerHTML = `<div class="tot"><span class="label">${P(lineas ? lineas + (lineas === 1 ? ' línea' : ' líneas') : 'Sin líneas todavía')}</span>
      <span class="cifra">${d > 0 ? enHoras(d) : P('Sin horas')}</span></div>
    <button class="btn btn-primary" data-accion="cerrar-parte" ${listo && S.firmaCliente && S.firmaTecnico ? '' : 'disabled'}>${P('Cerrar el parte')}</button>`;
}

function caja(quien, titulo, firma) {
  const hecha = !!firma;
  return `<div class="firma ${hecha ? 'hecha' : ''}">
    <span class="quien">${titulo}</span>
    ${hecha
      ? `<div style="font-size:26px">✓</div><span class="est">${esc(firma)}</span>`
      : `<button class="btn btn-secondary btn-ancho" data-firmar="${quien}">${quien === 'cliente' ? 'Firmar aquí mismo' : 'Firma del técnico'}</button>
         <span class="est">Falta la firma del ${quien === 'cliente' ? 'cliente' : 'técnico'} para cerrar el parte.</span>`}
  </div>`;
}
function plega(k, titulo, valor, cuerpo) {
  return `<details class="plega"><summary><span class="chev">▸</span>${titulo}<span class="val">${valor}</span></summary><div class="cuerpo">${cuerpo}</div></details>`;
}

// «La voz propone, el humano corrige»: el patrón de aiQuoteAssistant, con checkbox por línea. Aquí
// pesa más que en un presupuesto, porque un parte firmado hay que anularlo (máster, SCRUM-71).
function propuestas() {
  const g = (titulo, lista, clave) => !lista.length ? '' : `<div class="grupoSug"><span class="label">${titulo}</span>
    ${lista.map((s, i) => `<label class="sug"><input type="checkbox" data-sug="${clave}:${i}" checked>
      <span class="q"><b>${esc(s.c)}</b><span>${P(s.d)}</span></span><span class="uds">${s.q}</span></label>`).join('')}</div>`;
  return `<div class="propuestas">
    <span class="label">${P('Esto es lo que he entendido. Quita lo que no cuadre.')}</span>
    ${g('Mano de obra', PROPUESTAS.manoObra, 'mo')}
    ${g('Materiales', PROPUESTAS.materiales, 'ma')}
    <button class="btn btn-primary btn-ancho" style="margin-top:12px" data-accion="aceptar-lineas">${P('Añadir las líneas marcadas')}</button>
    <p class="nota">${P('Se apunta en el parte. Podrás cambiarlo antes de firmar.')}</p>
  </div>`;
}

// ── Gestos ───────────────────────────────────────────────────────────────────
function toast(m) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
const cerrarHoja = () => { $('#capa').innerHTML = ''; };

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-accion],[data-ahora],[data-tipo],[data-firmar],[data-cerrar]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; pintar(); return; }
  // 🔴 Cerrar SÓLO si se ha tocado el fondo o la «×». Antes la hoja llevaba un
  // `onclick="event.stopPropagation()"` para que tocar dentro no la cerrara, y eso impedía que los
  // botones de dentro llegaran a este manejador: «Confirmar firma» no hacía nada. Lo cazó la medida,
  // no la vista. `closest` ya devuelve el botón cuando se toca un botón, así que basta con mirar si
  // el toque cayó dentro de la hoja.
  if (t.dataset.cerrar != null) { if (t.classList.contains('cerrar') || !e.target.closest('.hoja')) cerrarHoja(); return; }
  if (t.dataset.ahora) { const n = new Date(); S[t.dataset.ahora] = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'); pintar(); return; }
  if (t.dataset.tipo) { S.tipo = S.tipo === t.dataset.tipo ? '' : t.dataset.tipo; pintar(); return; }
  if (t.dataset.firmar) { hojaFirma(t.dataset.firmar); return; }
  switch (t.dataset.accion) {
    case 'dictar':
      if (S.grabando) { S.grabando = false; S.texto = DICTADO_EJEMPLO; }
      else { S.grabando = true; setTimeout(() => { if (S.grabando) { S.grabando = false; S.texto = DICTADO_EJEMPLO; pintar(); } }, 1600); }
      pintar(); break;
    case 'ordenar':
      if (!S.texto.trim()) break;
      S.ordenado = true; pintar(); break;
    case 'aceptar-lineas': {
      const marcadas = [...document.querySelectorAll('[data-sug]')].filter((x) => x.checked).map((x) => x.dataset.sug);
      if (!marcadas.length) { toast('No has marcado ninguna línea.'); break; }
      S.manoObra = marcadas.filter((k) => k.startsWith('mo:')).map((k) => PROPUESTAS.manoObra[Number(k.split(':')[1])]);
      S.materiales = marcadas.filter((k) => k.startsWith('ma:')).map((k) => PROPUESTAS.materiales[Number(k.split(':')[1])]);
      if (!S.km) S.km = String(PROPUESTAS.km);
      S.ordenado = false; pintar(); toast('Líneas añadidas al parte.'); break;
    }
    case 'firmar-ok': {
      const quien = $('#capa').dataset.quien;
      const nombre = ($('#sp-nombre') || {}).value || '';
      if (!nombre.trim()) { toast('Escribe el nombre de quien firma el parte.'); break; }
      if (sinRed) { S.colaSinRed++; cerrarHoja(); S['firma' + (quien === 'cliente' ? 'Cliente' : 'Tecnico')] = nombre + ' · sin enviar'; pintar(); toast('Firma guardada en este móvil.'); break; }
      S['firma' + (quien === 'cliente' ? 'Cliente' : 'Tecnico')] = nombre;
      cerrarHoja(); pintar(); break;
    }
    case 'cerrar-parte': toast('En el prototipo esta acción no hace nada.'); break;
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'txt') { S.texto = el.value; const b = document.querySelector('[data-accion="ordenar"]'); if (b) b.disabled = !S.texto.trim(); return; }
  if (el.dataset.c) { S[el.dataset.c] = el.value; if (el.dataset.c === 'entrada' || el.dataset.c === 'salida') pintar(); }
});

// El pad, con el texto FIRMADO de SCRUM-919 cuando no hay cobertura. No se toca ni una palabra.
function hojaFirma(quien) {
  $('#capa').dataset.quien = quien;
  $('#capa').innerHTML = `<div class="overlay" data-cerrar><div class="hoja" role="dialog" aria-modal="true" aria-labelledby="ft">
    <div class="hoja-cab"><h3 id="ft">Firma del ${quien === 'cliente' ? 'cliente' : 'técnico'}</h3><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>
    <label class="campo"><span class="label">Nombre de quien firma</span><input type="text" id="sp-nombre" placeholder="Nombre y apellidos"></label>
    <p class="nota">Una firma sin nombre no identifica a nadie. Escribe el nombre de quien firma el parte.</p>
    <div class="pad">Firma aquí</div>
    ${sinRed ? `<div class="aviso">📶<div>Sin conexión. La firma está guardada en este móvil y se enviará cuando vuelva la señal con YaQu abierto. No hace falta volver a firmar.</div></div>` : ''}
    <button class="btn btn-primary btn-ancho" data-accion="firmar-ok">Confirmar firma</button></div></div>`;
  const i = $('#sp-nombre'); if (i) i.focus();
}

$('#resaltar').addEventListener('change', (e) => document.body.classList.toggle('sin-resaltar', !e.target.checked));
$('#sinred').addEventListener('change', (e) => { sinRed = e.target.checked; pintar(); });
pintar();
</script>
