<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de presupuesto · prototipo SCRUM-915</title>
<meta name="description" content="Prototipo navegable del editor de presupuesto y justificante como documento vivo guiado (SCRUM-915). Datos de ejemplo; no guarda nada.">
<style>
/* Tokens: DESIGN.md (única fuente). Nada inventado. */
:root{
  --brand:#16a34a; --brand-hover:#15803d; --brand-bright:#22c55e; --brand-ink:#052e16; --brand-tint:#ecfdf5; --brand-tint-ink:#166534;
  --ink:#0f1c17; --body:#3f4a45; --muted:#6b756f; --bg:#f6f7f5; --surface:#fff; --border:#e7e9e5; --neutral-100:#eef0ec;
  --danger:#dc2626; --warning:#b45309; --warning-bg:#fff7ed; --info:#2563eb;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-full:9999px;
  --s-xs:4px; --s-sm:8px; --s-md:16px; --s-lg:24px; --s-xl:40px;
  --sh-reposo:0 1px 2px rgba(16,24,40,.04);
  --sh-elevado:0 4px 12px -2px rgba(16,24,40,.08),0 2px 6px -2px rgba(16,24,40,.05);
  --sh-flotante:0 18px 40px -12px rgba(16,24,40,.18);
  --sh-foco:0 0 0 3px rgba(34,197,94,.30);
  --font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--body);font:400 15px/1.55 var(--font);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--sh-foco)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Botones (DESIGN.md §5) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 20px;border-radius:var(--r-full);border:1px solid transparent;font-weight:700;cursor:pointer;transition:background .15s,transform .15s,box-shadow .15s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-hover);transform:translateY(-1px)}
.btn-primary[disabled]{background:var(--neutral-100);color:var(--muted);transform:none;cursor:not-allowed}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink)}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer}
.chip:hover{box-shadow:var(--sh-elevado)}
.chip[aria-pressed="true"]{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-ink)}
.chip small{color:var(--muted);font-weight:500}

.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.input,.select,.textarea{width:100%;min-height:44px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--ink)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:var(--sh-foco);outline:none}
.textarea{resize:vertical}
.nota{font-size:13px;color:var(--muted);margin:6px 0 0}
.money{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}

/* Textos nuevos propuestos */
.propuesto{text-decoration:underline dashed var(--warning) 1.5px;text-underline-offset:3px}
body.sin-resaltar .propuesto{text-decoration:none}

/* Barra del prototipo (no es producto) */
.proto{position:relative;z-index:30;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 16px}
.proto strong{font-size:13px}
.proto .seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:var(--r-full);padding:3px}
.proto .seg button{min-height:36px;padding:6px 12px;border:0;border-radius:var(--r-full);background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.proto .seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.proto label{font-size:13px;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.proto .leyenda{font-size:12px;opacity:.85}
.proto .leyenda span{text-decoration:underline dashed #fbbf24 1.5px;text-underline-offset:3px}

/* Layout */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding:24px}
.rail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:16px}
.pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pasos button{display:flex;gap:12px;align-items:center;width:100%;min-height:48px;padding:8px 12px;border:0;border-radius:var(--r-md);background:transparent;text-align:left;cursor:pointer;color:var(--body)}
.pasos button:hover{background:var(--surface)}
.pasos .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);color:var(--muted)}
.pasos [data-estado="actual"] button{background:var(--surface);box-shadow:var(--sh-reposo);color:var(--ink);font-weight:600}
.pasos [data-estado="actual"] .num{border-color:var(--brand);color:var(--brand-ink)}
.pasos [data-estado="hecho"] .num{background:var(--brand);border-color:var(--brand);color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-reposo);padding:20px}
.kpi .cifra{display:block;font-size:clamp(1.75rem,3vw,2.25rem);font-weight:800;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.kpi .apoyo{font-size:13px;color:var(--muted);margin-top:4px}
.rail .acciones{display:flex;flex-direction:column;gap:8px}
.guardado{font-size:13px;color:var(--brand-tint-ink);text-align:center;min-height:20px}

/* La hoja */
.escenario{min-width:0}
.hoja{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-elevado);max-width:860px;margin:0 auto;padding:40px 44px}
.hoja-cab{display:flex;justify-content:space-between;gap:24px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.empresa{display:flex;gap:12px}
.logo{flex:none;width:48px;height:48px;border-radius:var(--r-md);background:var(--brand-tint);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.empresa b{color:var(--ink);display:block}
.empresa small,.docmeta small{display:block;color:var(--muted);font-size:13px}
.docmeta{text-align:right}
.docmeta .tipo{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.docmeta .num{font-size:20px;font-weight:700;color:var(--ink)}
.opciones-btn{margin-top:8px}

.bloque{padding:24px 0;border-bottom:1px solid var(--border);scroll-margin-top:24px;transition:opacity .15s}
.bloque:last-child{border-bottom:0}
.bloque-tit{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.bloque-tit .n{width:24px;height:24px;border-radius:50%;background:var(--neutral-100);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700}
.bloque-tit h2{margin:0;font-size:1.0625rem;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.bloque.hecho .bloque-tit .n{background:var(--brand);color:#fff}
.bloque.pendiente{opacity:.55}
.bloque.pendiente:focus-within,.bloque.pendiente:hover{opacity:1}
.siguiente{font-size:13px;color:var(--muted)}

/* Cliente */
.combo{position:relative;max-width:520px}
.lista{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-flotante);padding:6px;margin:0;list-style:none;max-height:320px;overflow:auto}
.lista button{width:100%;min-height:44px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.lista button:hover,.lista button:focus-visible{background:var(--bg)}
.lista small{color:var(--muted);display:block;font-size:13px}
.lista .nuevo{color:var(--brand-tint-ink);font-weight:700}
.para{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.para b{color:var(--ink);font-size:1.0625rem}
.para small{display:block;color:var(--muted)}

/* Compositor IA */
.compositor{border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;background:linear-gradient(180deg,var(--brand-tint),var(--surface) 60%)}
.compositor h3{margin:0 0 4px;color:var(--ink);font-size:1.25rem;letter-spacing:-.01em}
.compositor p{margin:0 0 12px}
.compositor .fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.otras{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.otras .fichas{display:flex;gap:8px;flex-wrap:wrap}
.sugerencias{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.sug{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer}
.sug input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.sug b{color:var(--ink)}
.aviso-supuesto{display:inline-block;margin-top:4px;font-size:13px;color:var(--warning);background:var(--warning-bg);border-radius:var(--r-sm);padding:2px 8px}

/* Líneas */
.lineas-cab,.linea{display:grid;grid-template-columns:minmax(0,1fr) 84px 110px 118px 116px 44px;gap:8px;align-items:center}
.lineas-cab{padding:0 8px 6px}
.lineas-cab span:nth-child(n+2){text-align:right}
.linea{padding:6px 8px;border-radius:var(--r-md);border:1px solid transparent}
.linea:hover{border-color:var(--border)}
.linea .input{border-color:transparent;background:transparent;padding:10px}
.linea .input:hover{border-color:var(--border)}
.linea .num{text-align:right;font-variant-numeric:tabular-nums}
.linea .tot{text-align:right}
.ajuste{min-height:44px;padding:4px 12px;border-radius:var(--r-full);border:0;background:var(--neutral-100);color:var(--body);font-size:13px;font-weight:600;cursor:pointer;justify-self:end}
.menu-linea{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--muted)}
.menu-linea:hover{background:var(--bg);color:var(--ink)}
.linea .rev{grid-column:1/-1;margin:-2px 10px 4px}
.linea .desc{grid-column:1/-1;margin:-4px 10px 4px;font-size:13px;color:var(--muted)}
.add-linea{margin-top:8px;width:100%;min-height:48px;border:1.5px dashed var(--border);border-radius:var(--r-md);background:transparent;color:var(--brand-tint-ink);font-weight:700;cursor:pointer}
.add-linea:hover{border-color:var(--brand)}
.mas-lineas{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.auto{position:relative}
.auto .lista{min-width:280px}

/* Importes */
.importes{display:flex;justify-content:flex-end}
.tabla-tot{width:100%;max-width:360px;border-collapse:collapse}
.tabla-tot td{padding:6px 0}
.tabla-tot td:last-child{text-align:right}
.tabla-tot .total td{border-top:1px solid var(--border);padding-top:12px}
.tabla-tot .total .cifra{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.pactado{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;border-radius:var(--r-md);background:var(--brand-tint);color:var(--brand-ink);margin-bottom:12px;flex-wrap:wrap}
.pactado .btn{min-height:44px;padding:8px 16px}

/* Condiciones */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fichas{display:flex;gap:8px;flex-wrap:wrap}
.tramo{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:8px;margin-top:8px}
.suma-ok{color:var(--brand-tint-ink);font-weight:600;font-size:14px}
.suma-mal{color:var(--danger);font-weight:600;font-size:14px}
.check{display:flex;gap:10px;align-items:center;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--brand)}

/* Móvil: por pasos */
.barra-pasos,.barra-abajo{display:none}
@media (max-width:899px){
  .app{grid-template-columns:1fr;padding:0 0 96px;gap:0}
  .rail{display:none}
  .barra-pasos{display:block;position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--border)}
  .barra-pasos .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .barra-pasos b{color:var(--ink)}
  .puntos{display:flex;gap:6px;margin-top:8px}
  .puntos i{flex:1;height:4px;border-radius:var(--r-full);background:var(--neutral-100)}
  .puntos i.on{background:var(--brand)}
  .hoja{border-radius:0;border-left:0;border-right:0;box-shadow:none;padding:20px 16px}
  .hoja-cab{flex-direction:column;gap:12px}
  .docmeta{text-align:left}
  body[data-modo="pasos"] .bloque{display:none;border-bottom:0;opacity:1}
  body[data-modo="pasos"] .bloque.visible{display:block}
  body[data-modo="pasos"] .hoja-cab{display:none}
  body[data-modo="pasos"][data-paso="5"] .hoja-cab{display:flex}
  .lineas-cab{display:none}
  .linea{grid-template-columns:minmax(0,1fr) 44px;grid-template-areas:"c m" "q q";border:1px solid var(--border);margin-bottom:8px;padding:8px}
  .linea .c-concepto{grid-area:c}
  .linea .menu-linea{grid-area:m}
  .linea .fila-num{grid-area:q;display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center}
  .linea .input{border-color:var(--border)}
  .grid2{grid-template-columns:1fr}
  .importes{justify-content:stretch}
  .tabla-tot{max-width:none}
  .barra-abajo{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--sh-flotante);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:12px;align-items:center}
  .barra-abajo .tot{flex:1;min-width:0}
  .barra-abajo .tot .cifra{font-size:1.375rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;display:block;line-height:1.1}
  .para{flex-direction:column}
}
@media (min-width:900px){ .fila-num{display:contents} }

/* Modales (AB3: modal centrado; hoja inferior ≤640 px) */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,28,23,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-flotante);width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.modal-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.modal-cab h3{margin:0;color:var(--ink);font-size:1.125rem}
.cerrar{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted)}
.modal .pie{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.modal .grupo{padding:14px 0;border-top:1px solid var(--border)}
.modal .grupo:first-of-type{border-top:0}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:88vh}
  .modal .pie .btn{flex:1}
}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-full);font-weight:600;box-shadow:var(--sh-flotante)}

/* Inventario */
.inv{max-width:1240px;margin:0 auto;padding:24px}
.inv h2{color:var(--ink);margin:0 0 8px}
.inv table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;font-size:14px}
.inv th,.inv td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.inv th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.inv td:first-child{white-space:nowrap;color:var(--muted)}
.inv .grupo td{background:var(--brand-tint);color:var(--brand-ink);font-weight:700}
@media (max-width:899px){
  .inv{padding:16px}
  .inv thead{display:none}
  .inv tr{display:block;border-bottom:1px solid var(--border);padding:8px 0}
  .inv td{display:block;border:0;padding:2px 12px;white-space:normal!important}
  .inv td::before{content:attr(data-h) " · ";font-size:12px;color:var(--muted);font-weight:600}
  .inv .grupo td::before{content:""}
}
</style>
</head>
<body data-modo="hoja" data-paso="1">

<div class="proto" role="region" aria-label="Controles del prototipo">
  <strong>Prototipo SCRUM-915 · datos de ejemplo, no guarda nada</strong>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-vista="proto" aria-pressed="true">Prototipo</button>
    <button type="button" data-vista="inv" aria-pressed="false">Inventario antes → después</button>
  </div>
  <div class="seg" role="group" aria-label="Documento">
    <button type="button" data-tipo="presupuesto" aria-pressed="true">Presupuesto</button>
    <button type="button" data-tipo="justificante" aria-pressed="false">Justificante</button>
  </div>
  <label><input type="checkbox" id="resaltar" checked> Resaltar textos nuevos</label>
  <span class="leyenda"><span>subrayado</span> = texto nuevo, propuesto y sin firmar</span>
</div>

<div id="vista-proto">
  <div class="barra-pasos" id="barraPasos"></div>
  <div class="app">
    <aside class="rail" id="rail" aria-label="Pasos del documento"></aside>
    <main class="escenario">
      <article class="hoja" id="hoja" aria-label="Documento"></article>
    </main>
  </div>
  <div class="barra-abajo" id="barraAbajo"></div>
</div>
<div id="vista-inv" hidden></div>
<div id="capa"></div>

<script>
(function(){
"use strict";
// ───────────────────────── Datos de ejemplo ─────────────────────────
const EMPRESA={nombre:'Fontanería Ejemplo',razon:'Fontanería Ejemplo S.L.',nif:'B00000000',dir:'C/ Mayor 12, 41001 Sevilla',wa:'600 000 000'};
const CLIENTES=[
  {id:1,nombre:'Comunidad Los Olivos',tel:'600 111 222',email:'olivos@correo.es',nif:'H00000000',ref:'CLI-014',dto:5,pagos:['bizum','transferencia']},
  {id:2,nombre:'Ana Ruiz',tel:'611 222 333',email:'',nif:'',ref:''},
  {id:3,nombre:'Talleres Martín S.L.',tel:'622 333 444',email:'admin@talleres.es',nif:'B11111111',ref:'CLI-031'}
];
const PLANTILLAS=[
  {nombre:'Revisión caldera estándar',lineas:[['Revisión anual de caldera',1,90,21],['Limpieza de quemador',1,35,21],['Desplazamiento',1,20,21]]},
  {nombre:'Cambio de grifo',lineas:[['Grifo monomando',1,64.9,21],['Mano de obra (hora)',1,38,21]]},
  {nombre:'Desatasco',lineas:[['Desatasco con máquina',1,120,21],['Desplazamiento',1,20,21]]}
];
const FRECUENTES=[['Mano de obra (hora)',38,14],['Desplazamiento',20,11],['Grifo monomando',64.9,6]];
const CATALOGO=[['Grifo monomando','Grifería cocina cromada',64.9,21],['Grifo termostático ducha','Con barra',119,21],['Mano de obra (hora)','',38,21],['Desplazamiento','Zona urbana',20,21],['Latiguillo flexible 40 cm','',6.5,21]];
const IA=[
  {c:'Reparación de fuga en tubería de cocina',q:1,p:85,t:21},
  {c:'Grifo mezclador monomando',q:1,p:64.9,t:21},
  {c:'Revisión de sifón',q:1,p:25,t:21,sup:['price']},
  {c:'Mano de obra (hora)',q:2,p:38,t:21,sup:['qty']}
];

// ───────────────────────── Estado ─────────────────────────
const hoyMas=(d)=>{const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10);};
const inicial=()=>({
  tipo:S?S.tipo:'presupuesto', paso:1, visitados:new Set([1]),
  cliente:null, busca:'', abiertoCliente:false,
  lineas:[], iaTexto:'', pensando:false, sugerencias:null, manual:false,
  cond:'FULL_UPFRONT', tramos:[{e:'Anticipo',p:50},{e:'Al finalizar',p:50}],
  pagos:{tarjeta:true,bizum:true,transferencia:true},
  validez:hoyMas(30), dtoGlobal:null, verDto:false,
  op:{ivaDef:21,ivaModo:'sumar',dir:'no',dirTxt:'',datos:{nombre:true,tel:true,nif:true,email:true},razon:'razon',incDesc:false},
  generado:null, autoLinea:null
});
let S=null; S=inicial();

// ───────────────────────── Utilidades ─────────────────────────
const eur=(n)=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n||0);
const esc=(s)=>String(s??'').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=(sel,el=document)=>el.querySelector(sel);
const P=(t)=>`<span class="propuesto">${t}</span>`;
const esPres=()=>S.tipo==='presupuesto';
const PASOS=()=>esPres()
  ? [['Para quién','Elige el cliente'],['Qué trabajo es','Describe el trabajo'],['Repasa los importes','Comprueba el total'],['Condiciones','Cobro y validez'],['Enviar','Genera y envía']]
  : [['Para quién','Elige el cliente'],['Qué trabajo es','Describe el trabajo'],['Repasa los importes','Comprueba el total'],['Emitir','Emite el justificante']];
const nPasos=()=>PASOS().length;
const lineaValida=(l)=>l.c.trim()&&l.q>0&&l.p>=0;
const baseLinea=(l)=>l.q*l.p*(1-(l.dto||0)/100);
function totales(){
  const vals=S.lineas.filter(lineaValida);
  const suma=vals.reduce((a,l)=>a+baseLinea(l),0);
  const dto=esPres()&&S.dtoGlobal?Math.min(S.dtoGlobal,suma):0;
  const f=suma?(suma-dto)/suma:0;
  const iva=vals.reduce((a,l)=>a+baseLinea(l)*f*((l.sup?0:l.t)/100),0);
  const base=suma-dto;
  const total=S.op.ivaModo==='no_incluido'&&esPres()?base:base+iva;
  return {suma,dto,base,iva,total,n:vals.length};
}
const hecho=(i)=>{
  if(i===1)return !!S.cliente;
  if(i===2)return S.lineas.some(lineaValida);
  if(i===3)return S.lineas.some(lineaValida)&&S.visitados.has(4);
  if(i===4)return esPres()?(S.cond!=='CUSTOM'||sumaTramos()===100)&&S.visitados.has(5):!!S.generado;
  if(i===5)return !!S.generado;
};
const sumaTramos=()=>S.tramos.reduce((a,t)=>a+(Number(t.p)||0),0);
const listo=()=>!!S.cliente&&S.lineas.some(lineaValida)&&(!esPres()||S.cond!=='CUSTOM'||sumaTramos()===100);
const accion=()=>esPres()?'Generar presupuesto':'Emitir justificante';
const pasosMovil=()=>matchMedia('(max-width:899px)').matches;

// ───────────────────────── Render ─────────────────────────
function render(){
  document.body.dataset.modo=pasosMovil()?'pasos':'hoja';
  document.body.dataset.paso=S.paso;
  renderRail(); renderHoja(); renderBarras();
}
function renderRail(){
  const t=totales();
  const verde=!!(listo());
  $('#rail').innerHTML=`
    <ol class="pasos">${PASOS().map(([n,s],i)=>{const k=i+1;const est=hecho(k)?'hecho':(S.paso===k?'actual':'pendiente');
      return `<li data-estado="${S.paso===k?'actual':est}"><button type="button" data-ir="${k}"><span class="num">${hecho(k)?'✓':k}</span><span>${P(n)}<br><small style="color:var(--muted)">${P(s)}</small></span></button></li>`;}).join('')}</ol>
    <div class="card kpi"><span class="label">${esPres()?'Total presupuesto':'Total'}</span><span class="cifra">${eur(t.total)}</span>
      <div class="apoyo">Base imponible ${eur(t.base)} · IVA ${eur(S.op.ivaModo==='no_incluido'&&esPres()?0:t.iva)}</div></div>
    <div class="acciones">
      <button class="btn ${verde?'btn-primary':'btn-secondary'} btn-block" data-accion="generar" ${listo()?'':'disabled aria-disabled="true"'}>${accion()}</button>
      ${listo()?'':`<p class="nota" style="text-align:center;margin:0">${P(!S.cliente?'Falta elegir el cliente':'Falta al menos una línea con concepto, cantidad y precio')}</p>`}
      <button class="btn btn-secondary btn-block" data-accion="opciones">⚙︎ ${P('Opciones del documento')}</button>
      <button class="btn btn-ghost btn-block" data-accion="guardar-plantilla">💾 Guardar como plantilla</button>
      <button class="btn btn-ghost btn-block" data-accion="limpiar">Limpiar formulario</button>
      ${esPres()?`<div class="guardado" id="guardado" aria-live="polite"></div>`:''}
    </div>`;
}
function bloque(k,titulo,contenido){
  const est=hecho(k)?'hecho':'';
  const primeroPendiente=[1,2,3,4,5].find((i)=>i<=nPasos()&&!hecho(i));
  const pend=!pasosMovil()&&primeroPendiente&&k>primeroPendiente&&!hecho(k)?'pendiente':'';
  const vis=pasosMovil()&&(S.paso===k||(S.paso===nPasos()&&k<nPasos()))?'visible':'';
  return `<section class="bloque ${est} ${pend} ${vis}" id="paso-${k}" data-bloque="${k}" aria-labelledby="t-${k}">
    <div class="bloque-tit"><span class="n">${hecho(k)?'✓':k}</span><h2 id="t-${k}">${P(titulo)}</h2>${pend?`<span class="siguiente">${P('Después de «'+PASOS()[k-2][0]+'»')}</span>`:''}</div>
    ${contenido}</section>`;
}
function renderHoja(){
  const foco=document.activeElement&&document.activeElement.dataset?{id:document.activeElement.id,k:document.activeElement.dataset.k,i:document.activeElement.dataset.i,pos:document.activeElement.selectionStart}:null;
  const t=totales();
  const final=pasosMovil()&&S.paso===nPasos();
  $('#hoja').innerHTML=`
    <header class="hoja-cab">
      <div class="empresa"><div class="logo" aria-hidden="true">FE</div><div><b>${EMPRESA.nombre}</b><small>${EMPRESA.razon} · NIF ${EMPRESA.nif}</small><small>${EMPRESA.dir} · WhatsApp ${EMPRESA.wa}</small></div></div>
      <div class="docmeta"><div class="tipo">${esPres()?'PRESUPUESTO':'JUSTIFICANTE'}</div><div class="num">${S.generado?S.generado:P('Nº al generar')}</div>
        <small>${new Date().toLocaleDateString('es-ES')}</small>${esPres()?`<small>Válido hasta ${new Date(S.validez).toLocaleDateString('es-ES')}</small>`:''}</div>
    </header>
    ${bloque(1,'Para quién',renderCliente())}
    ${bloque(2,'Qué trabajo es',renderTrabajo())}
    ${bloque(3,'Repasa los importes',renderImportes(t))}
    ${esPres()?bloque(4,'Condiciones',renderCondiciones()):''}
    ${final?renderFinal(t):''}`;
  if(foco&&(foco.id||foco.k)){
    const el=foco.id?document.getElementById(foco.id):$(`[data-k="${foco.k}"][data-i="${foco.i}"]`);
    if(el){el.focus();try{if(foco.pos!=null)el.setSelectionRange(foco.pos,foco.pos);}catch(e){}}
  }
}
function renderCliente(){
  if(S.cliente){const c=S.cliente;
    return `<div class="para"><div><b>${esc(c.nombre)}</b>${c.nif?`<small>NIF ${esc(c.nif)}</small>`:''}<small>${esc(c.tel)}${c.email?' · '+esc(c.email):''}</small>
      ${esPres()&&S.op.dir!=='no'?`<small>Obra: ${esc(S.op.dir==='fact'?'C/ del Cliente 3, Sevilla':S.op.dirTxt||'—')}</small>`:''}</div>
      <button class="btn btn-secondary" data-accion="cambiar-cliente">${P('Cambiar')}</button></div>`;}
  const q=S.busca.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const res=CLIENTES.filter((c)=>!q||[c.nombre,c.tel,c.email,c.ref].join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q));
  return `<div class="combo"><label class="sr" for="busca">Cliente</label>
    <input class="input" id="busca" type="search" autocomplete="off" placeholder="Buscar por nombre, teléfono, email o referencia…" value="${esc(S.busca)}" role="combobox" aria-expanded="${S.abiertoCliente}" aria-controls="lista-clientes">
    ${S.abiertoCliente?`<ul class="lista" id="lista-clientes" role="listbox">
      <li><button type="button" class="nuevo" data-accion="nuevo-cliente">+ Nuevo cliente</button></li>
      ${res.length?res.map((c)=>`<li><button type="button" data-cliente="${c.id}">${esc(c.nombre)}<small>${esc(c.tel)}${c.ref?' · '+c.ref:''}</small></button></li>`).join(''):`<li><small style="padding:8px 10px;display:block">Sin resultados para tu búsqueda</small></li>`}
    </ul>`:''}</div>`;
}
function renderTrabajo(){
  const hay=S.lineas.length>0;
  if(!hay&&!S.manual){
    return `<div class="compositor">
      <p>${P('Descríbelo con tus propias palabras y te proponemos las líneas del presupuesto usando tu catálogo de productos.')}</p>
      <label class="field"><span class="label">Descripción del trabajo</span>
      <textarea class="textarea" id="ia" rows="4" placeholder="Ej: Reparar avería en tubería de cocina, cambiar grifo mezclador y revisar sifón. También verificar el calentador de agua.">${esc(S.iaTexto)}</textarea></label>
      <div class="fila">
        <button class="btn ${S.cliente||!pasosMovil()?'btn-primary':'btn-secondary'}" data-accion="ia" ${S.pensando?'disabled':''}>${S.pensando?'⏳ Pensando…':'✨ Generar sugerencias'}</button>
        <button class="btn btn-secondary" data-accion="dictar" title="Sólo si el dictado está activo">🎤 Dictar</button>
      </div>
      ${S.sugerencias?renderSugerencias():''}
    </div>
    <div class="otras">
      <span class="label">Empieza con una plantilla</span>
      <div class="fichas">${PLANTILLAS.map((p,i)=>`<button class="chip" data-plantilla="${i}">${esc(p.nombre)} <small>${p.lineas.length} líneas</small></button>`).join('')}</div>
      <span class="label">Tus conceptos más usados</span>
      <div class="fichas">${FRECUENTES.map((f,i)=>`<button class="chip" data-frecuente="${i}">${esc(f[0])} <small>en ${f[2]} presupuestos</small></button>`).join('')}</div>
      <div><button class="btn btn-ghost" data-accion="manual">${P('O escríbelo a mano')} →</button></div>
    </div>`;
  }
  return `
    <div class="lineas-cab" aria-hidden="true"><span class="label">Concepto</span><span class="label">Cantidad</span><span class="label">Precio</span><span class="label">IVA</span><span class="label">Total</span><span></span></div>
    <div id="lineas">${S.lineas.map(renderLinea).join('')}</div>
    <button class="add-linea" data-accion="add-linea">+ Añadir línea</button>
    <div class="mas-lineas">
      <button class="btn btn-secondary" data-accion="abrir-ia">✨ Sugerir con IA</button>
      <button class="btn btn-secondary" data-accion="usar-plantilla">📋 Usar plantilla</button>
    </div>
    ${S.sugerencias?`<div class="compositor" style="margin-top:12px">${renderSugerencias()}</div>`:''}`;
}
function renderSugerencias(){
  return `<div class="sugerencias" role="group" aria-label="Sugerencias">
    <b style="color:var(--ink)">Sugerencias (selecciona las que quieras añadir):</b>
    ${S.sugerencias.map((s,i)=>`<label class="sug"><input type="checkbox" data-sug="${i}" ${s.on?'checked':''}>
      <span><b>${esc(s.c)}</b><br>Cantidad: ${s.q} · Precio: ${eur(s.p)} · IVA: ${s.t}%
      ${s.sup?`<br><span class="aviso-supuesto">Esto lo hemos puesto nosotros: ${s.sup.map((x)=>x==='qty'?'cantidad':'precio').join(' y ')}. Revísalo antes de enviar.</span>`:''}</span></label>`).join('')}
    <div><button class="btn btn-primary" data-accion="anadir-sug">Añadir líneas seleccionadas</button></div></div>`;
}
function renderLinea(l,i){
  const tot=lineaValida(l)?eur(baseLinea(l)*(1+(l.sup?0:l.t)/100)):'—';
  const chip=l.sup?'Suplido · sin IVA':`IVA ${l.t} %${l.dto?' · Dto. '+l.dto+' %':''}`;
  const auto=S.autoLinea===i&&l.c.length>=2?CATALOGO.filter((p)=>p[0].toLowerCase().includes(l.c.toLowerCase())):null;
  return `<div class="linea" data-linea="${i}">
    <div class="c-concepto auto"><label class="sr" for="c-${i}">Concepto</label>
      <input class="input" id="c-${i}" data-k="c" data-i="${i}" placeholder="Concepto / servicio" value="${esc(l.c)}" autocomplete="off">
      ${auto?`<ul class="lista">${auto.length?auto.map((p,j)=>`<li><button type="button" data-auto="${i}:${j}">${esc(p[0])}<small>${esc(p[1])} · ${eur(p[2])}</small></button></li>`).join(''):'<li><small style="padding:8px 10px;display:block">Sin resultados</small></li>'}</ul>`:''}
    </div>
    <div class="fila-num">
      <label class="sr" for="q-${i}">Cantidad</label><input class="input num" id="q-${i}" data-k="q" data-i="${i}" type="number" min="0" step="1" value="${l.q}" inputmode="decimal">
      <label class="sr" for="p-${i}">Precio</label><input class="input num" id="p-${i}" data-k="p" data-i="${i}" type="number" min="0" step="0.01" value="${l.p===''?'':l.p}" placeholder="0,00" inputmode="decimal">
      <button type="button" class="ajuste" data-ajustes="${i}" title="Ajustes de la línea">${chip}</button>
      <span class="money tot" data-tot="${i}">${tot}</span>
    </div>
    <button type="button" class="menu-linea" data-menu="${i}" aria-label="Acciones de la línea">⋯</button>
    ${l.sup2&&!l.revisado?`<span class="rev aviso-supuesto">${P('Propuesto por la IA: '+l.sup2.map((x)=>x==='qty'?'cantidad':'precio').join(' y ')+'. Revísalo antes de enviar.')} <button class="btn btn-ghost" style="padding:0 12px" data-revisado="${i}">${P('Revisado')}</button></span>`:''}
    ${l.desc&&(S.op.incDesc||!esPres())?`<span class="desc">${esc(l.desc)}</span>`:''}
  </div>`;
}
function renderImportes(t){
  const c=S.cliente;
  const pact=esPres()&&c&&c.dto&&S.lineas.some((l)=>lineaValida(l)&&!l.dto);
  return `${pact?`<div class="pactado"><span>${P('Este cliente tiene pactado un descuento del '+c.dto+' %')}</span><button class="btn btn-secondary" data-accion="aplicar-dto">${P('Aplicar a las líneas')}</button></div>`:''}
    <div class="importes"><table class="tabla-tot"><tbody>
      ${t.dto?`<tr><td>Suma de líneas</td><td class="money">${eur(t.suma)}</td></tr><tr><td>Descuento global</td><td class="money">−${eur(t.dto)}</td></tr>`:''}
      <tr><td>Base imponible</td><td class="money">${eur(t.base)}</td></tr>
      <tr><td>IVA</td><td class="money">${S.op.ivaModo==='no_incluido'&&esPres()?'IVA no incluido':eur(t.iva)}</td></tr>
      ${esPres()?`<tr><td colspan="2">${S.verDto||S.dtoGlobal?`<label class="field"><span class="label">Descuento global</span><input class="input num" id="dtoGlobal" type="number" min="0" step="0.01" value="${S.dtoGlobal??''}" placeholder="0,00 €"></label>`:`<button class="btn btn-ghost" style="padding-left:0" data-accion="ver-dto">+ Añadir descuento</button>`}</td></tr>`:''}
      <tr class="total"><td><span class="label">${esPres()?'Total presupuesto':'Total'}</span></td><td><span class="cifra">${eur(t.total)}</span></td></tr>
    </tbody></table></div>`;
}
function renderCondiciones(){
  const c=S.cliente; const suma=sumaTramos();
  const pagosPactados=c&&c.pagos&&['tarjeta','bizum','transferencia'].some((m)=>S.pagos[m]!==c.pagos.includes(m));
  const COND=[['FULL_UPFRONT','Pago 100% al aceptar'],['FIFTY_FIFTY','50% al aceptar, 50% al finalizar'],['CUSTOM','Plan personalizado (por tramos)'],['MANUAL','Solo presupuesto (facturación manual)'],['','Sin condiciones específicas']];
  return `<div class="grid2">
    <div>
      <span class="label">Condiciones de pago</span>
      <div class="fichas" style="margin-top:8px">${COND.map(([v,n])=>`<button class="chip" data-cond="${v}" aria-pressed="${S.cond===v}">${n}</button>`).join('')}</div>
      ${S.cond==='CUSTOM'?`<div style="margin-top:12px"><span class="label">Tramos de cobro</span>
        ${S.tramos.map((tr,i)=>`<div class="tramo"><input class="input" data-tramo-e="${i}" placeholder="Etiqueta (p. ej. Anticipo)" value="${esc(tr.e)}" aria-label="Etiqueta del tramo ${i+1}"><input class="input num" data-tramo-p="${i}" type="number" min="0" max="100" placeholder="%" value="${tr.p}" aria-label="Porcentaje del tramo ${i+1}"><button class="menu-linea" data-quitar-tramo="${i}" title="Eliminar tramo" aria-label="Eliminar tramo">🗑️</button></div>`).join('')}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" style="padding-left:0" data-accion="add-tramo">+ Añadir tramo</button>
        <span id="sumaTramos" class="${suma===100?'suma-ok':'suma-mal'}">${suma===100?`Suman ${suma} % ✓`:`Suman ${suma} % — deben sumar 100 %`}</span></div></div>`:''}
      <div style="margin-top:20px"><label class="field"><span class="label">Válido hasta</span><input class="input" id="validez" type="date" min="${hoyMas(1)}" value="${S.validez}"></label>
        <div class="fichas" style="margin-top:8px">${[7,14,30].map((d)=>`<button class="chip" data-dias="${d}">${d} días</button>`).join('')}</div>
        <p class="nota">Pasada esta fecha el presupuesto caduca solo y el cliente verá "pide uno actualizado".</p></div>
    </div>
    <div>
      <span class="label">Formas de pago que verá el cliente</span>
      ${pagosPactados?`<div class="pactado" style="margin-top:8px"><span>Formas de pago pactadas · ${c.pagos.map((m)=>({bizum:'📲 Bizum',transferencia:'🏦 Transferencia',tarjeta:'💳 Tarjeta'}[m])).join(' · ')}</span><button class="btn btn-secondary" data-accion="aplicar-pagos">${P('Aplicar')}</button></div>`:''}
      ${[['tarjeta','💳 Tarjeta'],['bizum','📲 Bizum'],['transferencia','🏦 Transferencia']].map(([m,n])=>`<label class="check"><input type="checkbox" data-pago="${m}" ${S.pagos[m]?'checked':''}> ${n}</label>`).join('')}
      <p class="nota">Solo se muestran las que tengas configuradas (IBAN, Bizum o tarjeta).</p>
      <p class="nota">💳 La tarjeta lleva una comisión del <b>0,9 %</b> por cobro. Bizum y transferencia, gratis.</p>
    </div></div>`;
}
function renderFinal(t){
  return `<section class="bloque visible" id="paso-final"><div class="bloque-tit"><span class="n">${nPasos()}</span><h2>${P(esPres()?'Enviar':'Emitir')}</h2></div>
    <p>${P(esPres()?'Así lo verá el cliente. Genera el presupuesto y elige cómo mandárselo.':'Revisa el justificante antes de emitirlo.')}</p></section>`;
}
function renderBarras(){
  const pasos=PASOS(); const k=S.paso; const t=totales();
  $('#barraPasos').innerHTML=`<div class="t"><b>${P(pasos[k-1][0])}</b><span class="nota" style="margin:0">${P('Paso '+k+' de '+pasos.length)}</span></div>
    <div class="puntos">${pasos.map((_,i)=>`<i class="${i<k?'on':''}"></i>`).join('')}</div>`;
  const ultimo=k===pasos.length;
  $('#barraAbajo').innerHTML=`
    ${k>1?`<button class="btn btn-secondary" data-accion="atras" aria-label="Paso anterior">←</button>`:''}
    <div class="tot"><span class="label">${esPres()?'Total presupuesto':'Total'}</span><span class="cifra">${eur(t.total)}</span></div>
    ${ultimo?`<button class="btn btn-primary" data-accion="generar" ${listo()?'':'disabled'}>${esPres()?'Generar':'Emitir'}</button>`
      :`<button class="btn btn-primary" data-accion="continuar" ${puedeSeguir(k)?'':'disabled'}>${P('Continuar')}</button>`}`;
}
const puedeSeguir=(k)=>k===1?!!S.cliente:k===2?S.lineas.some(lineaValida):k===4&&esPres()?(S.cond!=='CUSTOM'||sumaTramos()===100):true;

// Actualización ligera mientras se escribe (sin repintar la hoja)
function refrescarNumeros(){
  const t=totales();
  S.lineas.forEach((l,i)=>{const el=$(`[data-tot="${i}"]`);if(el)el.textContent=lineaValida(l)?eur(baseLinea(l)*(1+(l.sup?0:l.t)/100)):'—';});
  renderRail(); renderBarras();
  const imp=$('#paso-3'); if(imp){const nuevo=document.createElement('div');nuevo.innerHTML=renderImportes(t);
    const vieja=imp.querySelector('.importes');const pact=imp.querySelector('.pactado');
    if(pact)pact.remove(); if(vieja){const frag=nuevo; const act=document.activeElement&&document.activeElement.id==='dtoGlobal';
      if(!act){vieja.replaceWith(frag.querySelector('.importes')); const p2=frag.querySelector('.pactado'); if(p2)imp.insertBefore(p2,imp.querySelector('.importes'));}}}
  const s=$('#sumaTramos'); if(s){const n=sumaTramos();s.className=n===100?'suma-ok':'suma-mal';s.textContent=n===100?`Suman ${n} % ✓`:`Suman ${n} % — deben sumar 100 %`;}
  guardadoAuto();
}
let tGuard=null;
function guardadoAuto(){ if(!esPres())return; clearTimeout(tGuard); tGuard=setTimeout(()=>{const g=$('#guardado'); if(g){g.textContent='✓ Guardado automáticamente'; setTimeout(()=>{if(g)g.textContent='';},1500);}},700); }
function toast(msg){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function nuevaLinea(c='',q=1,p='',t){S.lineas.push({c,q,p,t:t??S.op.ivaDef,dto:0,sup:false,desc:''});}
function irA(k){
  S.paso=Math.max(1,Math.min(nPasos(),k)); S.visitados.add(S.paso);
  render();
  if(!pasosMovil()){const el=document.getElementById('paso-'+Math.min(k,esPres()?4:3)); if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
  else window.scrollTo({top:0});
}

// ───────────────────────── Modales ─────────────────────────
function modal(titulo,cuerpo,pie,alAbrir){
  const capa=$('#capa');
  capa.innerHTML=`<div class="overlay" data-cerrar-fuera><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="modal-cab"><h3 id="mt">${titulo}</h3><button class="cerrar" data-cerrar aria-label="Cerrar">×</button></div>${cuerpo}${pie?`<div class="pie">${pie}</div>`:''}</div></div>`;
  const m=capa.querySelector('.modal'); const f=m.querySelector('input,select,textarea,button:not(.cerrar)'); (f||m.querySelector('.cerrar')).focus();
  if(alAbrir)alAbrir(m);
}
const cerrarModal=()=>{$('#capa').innerHTML='';};

function guardarOpciones(){
  const m=$('#capa .modal'); if(!m)return;
  S.op.ivaDef=Number(m.querySelector('#o-ivaDef').value);
  if(esPres()){S.op.ivaModo=m.querySelector('#o-ivaModo').value;S.op.dir=m.querySelector('#o-dir').value;S.op.dirTxt=m.querySelector('#o-dirTxt').value;
    m.querySelectorAll('[data-od]').forEach((c)=>{S.op.datos[c.dataset.od]=c.checked;});
    S.op.razon=(m.querySelector('[name=razon]:checked')||{}).value||'razon'; S.op.incDesc=m.querySelector('#o-incDesc').checked;}
  cerrarModal(); render(); guardadoAuto();
}
function abrirAjustes(i){
  const l=S.lineas[i];
  modal('Ajustes de la línea',`
    <p style="margin-top:0;color:var(--ink);font-weight:600">${esc(l.c)||'Línea sin concepto todavía'}</p>
    ${esPres()?`<div class="grupo"><label class="check"><input type="checkbox" id="a-sup" ${l.sup?'checked':''}> Suplido (pagado por cuenta del cliente)</label>
      <p class="nota">Lo que has pagado por cuenta del cliente y le repercutes tal cual: una tasa, un visado, una licencia. No lleva IVA ni margen. El material que compras tú no es un suplido: ese se vende con su IVA.</p></div>`:''}
    <div class="grupo grid2">
      <label class="field"><span class="label">IVA %</span><select class="select" id="a-iva" ${l.sup?'disabled':''}>${[21,10,4,0].map((v)=>`<option ${l.t===v?'selected':''}>${v}</option>`).join('')}</select></label>
      ${esPres()?`<label class="field"><span class="label">Dto. %</span><input class="input" id="a-dto" type="number" min="0" max="100" value="${l.dto||''}"></label>`:''}
    </div>
    ${esPres()?`<div class="grupo grid2"><label class="field"><span class="label">Coste <small>(sólo lo ves tú)</small></span><input class="input" id="a-coste" type="number" min="0" step="0.01" value="${l.coste||''}"></label></div>
    <div class="grupo"><label class="field"><span class="label">${P('Descripción')}</span><textarea class="textarea" id="a-desc" rows="2">${esc(l.desc)}</textarea></label>
      <p class="nota">${P('Sale bajo el concepto si en Opciones marcas «Incluir descripción en el PDF».')}</p></div>`:''}
  `,`<button class="btn btn-primary" data-accion="ajustes-listo" data-i="${i}">Listo</button>`,(m)=>{
    const sup=m.querySelector('#a-sup'); if(sup)sup.addEventListener('change',()=>{m.querySelector('#a-iva').disabled=sup.checked;});
  });
}
function guardarAjustes(i){
  const m=$('#capa .modal'); const l=S.lineas[i];
  l.t=Number(m.querySelector('#a-iva').value);
  if(esPres()){l.sup=m.querySelector('#a-sup').checked;l.dto=Number(m.querySelector('#a-dto').value)||0;l.coste=m.querySelector('#a-coste').value;l.desc=m.querySelector('#a-desc').value;}
  cerrarModal(); render(); guardadoAuto();
}
function abrirMenu(i){
  const n=S.lineas.length;

    <button class="btn btn-secondary btn-block" data-accion="ajustes" data-i="${i}">${P('Ajustes (IVA, descuento, descripción…)')}</button>
    <button class="btn btn-secondary btn-block" data-accion="subir" data-i="${i}" ${i===0?'disabled':''}>↑  Subir</button>
    <button class="btn btn-secondary btn-block" data-accion="bajar" data-i="${i}" ${i===n-1?'disabled':''}>↓  Bajar</button>
    <button class="btn btn-secondary btn-block" data-accion="eliminar" data-i="${i}" style="color:var(--danger)">🗑️  Eliminar línea</button></div>`,'');
}
function abrirPlantillas(){
  modal('📋 Usar plantilla',`<p style="margin-top:0">Elige una plantilla para cargar sus líneas en el presupuesto actual.</p>
    ${PLANTILLAS.map((p,i)=>`<div class="grupo" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><b style="color:var(--ink)">${esc(p.nombre)}</b><br><small style="color:var(--muted)">${p.lineas.length} línea(s) · EUR</small></div><button class="btn btn-secondary" data-plantilla="${i}">Usar →</button></div>`).join('')}`,'');
}
function abrirGuardarPlantilla(){
  const n=S.lineas.filter((l)=>l.c.trim()&&l.p!=='').length;
  if(!n){toast('Añade al menos una línea con concepto y precio antes de guardar la plantilla.');return;}
  modal('💾 Guardar plantilla',`<p style="margin-top:0">Dale un nombre a esta plantilla para reutilizarla en futuros presupuestos.</p>
    <label class="field"><span class="label">Nombre de la plantilla</span><input class="input" id="nomPlantilla" placeholder="Ej. Revisión caldera estándar"></label>
    <p class="nota">${n} línea(s) se guardarán. ${P('Con su descripción, descuento y suplido.')}</p>`,
    `<button class="btn btn-primary" data-accion="plantilla-ok">Guardar plantilla</button>`);
}

function abrirGenerado(){
  if(!esPres()){ S.generado='J-2026-0042'; cerrarModal(); toast('Justificante emitido'); render(); return; }
  S.generado='#128';
  const t=totales();
  modal('Presupuesto #128 generado',`<p style="margin-top:0">Revisa el PDF del presupuesto antes de enviarlo por WhatsApp al cliente.</p>
    <div class="card" style="background:var(--bg)"><b style="color:var(--ink)">${esc(S.cliente.nombre)}</b><br><span class="nota">${t.n} líneas · válido hasta ${new Date(S.validez).toLocaleDateString('es-ES')}</span><div class="money" style="font-size:1.5rem;margin-top:6px">${eur(t.total)}</div></div>
    <p><a href="#" class="btn btn-ghost" style="padding-left:0;color:var(--brand-tint-ink)" onclick="return false">Abrir PDF en nueva pestaña →</a></p>
    <span class="label">Enviar al cliente</span>`,
    `<button class="btn btn-ghost" data-cerrar>Seguir editando</button><a class="btn btn-secondary" href="#" onclick="return false">⬇ Descargar PDF</a><button class="btn btn-secondary" data-accion="enviar-email">✉ Enviar por email</button><button class="btn btn-primary" data-accion="enviar-wa">Enviar por WhatsApp</button>`);
  render();
}

document.addEventListener('click',(e)=>{
  const b=e.target.closest('button,[data-cerrar-fuera]'); if(!b)return;
  if(b.matches('[data-cerrar-fuera]')){ if(e.target===b)cerrarModal(); return; }
  if(b.dataset.vista){document.querySelectorAll('[data-vista]').forEach((x)=>x.setAttribute('aria-pressed',x===b));
    $('#vista-proto').hidden=b.dataset.vista!=='proto'; $('#vista-inv').hidden=b.dataset.vista!=='inv'; if(b.dataset.vista==='inv')renderInventario(); return;}
  if(b.dataset.tipo){const cli=S.cliente,lin=S.lineas; S.tipo=b.dataset.tipo; const n=inicial(); n.tipo=b.dataset.tipo; n.cliente=cli; n.lineas=lin; S=n;
    document.querySelectorAll('[data-tipo]').forEach((x)=>x.setAttribute('aria-pressed',x===b)); render(); return;}
  if(b.hasAttribute('data-cerrar')){cerrarModal();return;}
  if(b.dataset.ir){irA(Number(b.dataset.ir));return;}
  if(b.dataset.cliente){S.cliente=CLIENTES.find((c)=>c.id==b.dataset.cliente);S.abiertoCliente=false;S.busca='';S.visitados.add(2);if(S.paso===1&&!pasosMovil())S.paso=2;render();guardadoAuto();return;}
  if(b.dataset.plantilla){const p=PLANTILLAS[b.dataset.plantilla];const vacia=!S.lineas.some((l)=>l.c.trim());if(vacia)S.lineas=[];
    p.lineas.forEach(([c,q,pr,t])=>nuevaLinea(c,q,pr,t));S.manual=true;cerrarModal();render();toast(`Plantilla "${p.nombre}" cargada — ${p.lineas.length} líneas añadidas.`);guardadoAuto();return;}
  if(b.dataset.frecuente){const f=FRECUENTES[b.dataset.frecuente];nuevaLinea(f[0],1,'');S.manual=true;render();const el=$(`#p-${S.lineas.length-1}`);if(el)el.focus();return;}
  if(b.dataset.auto){const [i,j]=b.dataset.auto.split(':').map(Number);const p=CATALOGO.filter((x)=>x[0].toLowerCase().includes(S.lineas[i].c.toLowerCase()))[j];
    Object.assign(S.lineas[i],{c:p[0],p:p[2],t:p[3],desc:S.lineas[i].desc||p[1]});S.autoLinea=null;if(i===S.lineas.length-1)nuevaLinea();render();const el=$(`#q-${i}`);if(el)el.focus();return;}
  if(b.dataset.ajustes){abrirAjustes(Number(b.dataset.ajustes));return;}
  if(b.dataset.menu){abrirMenu(Number(b.dataset.menu));return;}
  if(b.dataset.revisado){S.lineas[b.dataset.revisado].revisado=true;render();return;}
  if(b.dataset.cond!==undefined){S.cond=b.dataset.cond;render();guardadoAuto();return;}
  if(b.dataset.dias){S.validez=hoyMas(Number(b.dataset.dias));render();return;}
  if(b.dataset.quitarTramo){S.tramos.splice(Number(b.dataset.quitarTramo),1);render();return;}
  const a=b.dataset.accion; if(!a)return;
  const i=Number(b.dataset.i);
  switch(a){
    case 'cambiar-cliente':S.cliente=null;S.abiertoCliente=true;render();$('#busca').focus();break;
    case 'nuevo-cliente':S.abiertoCliente=false;abrirNuevoCliente();break;
    case 'nc-ok':{const n=$('#nc-nombre').value.trim()||'Cliente nuevo';const c={id:Date.now(),nombre:n,tel:$('#nc-tel').value,email:$('#nc-email').value,nif:$('#nc-nif').value};CLIENTES.push(c);S.cliente=c;cerrarModal();if(!pasosMovil())S.paso=2;render();break;}
    case 'ia':{const tx=$('#ia').value.trim();S.iaTexto=tx;if(!tx){toast('Escribe una descripción del trabajo.');break;}S.pensando=true;render();
      setTimeout(()=>{S.pensando=false;S.sugerencias=IA.map((x)=>({...x,on:true}));render();},900);break;}
    case 'dictar':toast('Dictado: sólo con la voz activada en este negocio y navegador compatible.');break;
    case 'abrir-ia':S.lineas=S.lineas.filter((l)=>l.c.trim()||l.p!=='');if(!S.lineas.length){S.manual=false;render();$('#ia').focus();}else{S.iaTexto='';modal('✨ Sugerir líneas con IA',`<p style="margin-top:0">${P('Descríbelo con tus propias palabras y te proponemos las líneas del presupuesto usando tu catálogo de productos.')}</p><label class="field"><span class="label">Descripción del trabajo</span><textarea class="textarea" id="ia-m" rows="4"></textarea></label>`,`<button class="btn btn-primary" data-accion="ia-m">✨ Generar sugerencias</button>`);}break;
    case 'ia-m':cerrarModal();S.sugerencias=IA.map((x)=>({...x,on:true}));render();break;
    case 'anadir-sug':{const sel=S.sugerencias.filter((s)=>s.on);if(!sel.length){toast('Selecciona al menos una línea.');break;}
      if(!S.lineas.some((l)=>l.c.trim()))S.lineas=[];sel.forEach((s)=>{nuevaLinea(s.c,s.q,s.p,s.t);if(s.sup)S.lineas[S.lineas.length-1].sup2=s.sup;});
      S.sugerencias=null;S.manual=true;S.visitados.add(3);render();guardadoAuto();break;}
    case 'manual':S.manual=true;if(!S.lineas.length)nuevaLinea();render();$('#c-0').focus();break;
    case 'add-linea':nuevaLinea();render();$(`#c-${S.lineas.length-1}`).focus();break;
    case 'usar-plantilla':abrirPlantillas();break;
    case 'ajustes':abrirAjustes(i);break;
    case 'ajustes-listo':guardarAjustes(i);break;
    case 'subir':[S.lineas[i-1],S.lineas[i]]=[S.lineas[i],S.lineas[i-1]];cerrarModal();render();break;
    case 'bajar':[S.lineas[i+1],S.lineas[i]]=[S.lineas[i],S.lineas[i+1]];cerrarModal();render();break;
    case 'eliminar':S.lineas.splice(i,1);if(!S.lineas.length)nuevaLinea();cerrarModal();render();break;
    case 'ver-dto':S.verDto=true;render();$('#dtoGlobal').focus();break;
    case 'aplicar-dto':S.lineas.forEach((l)=>{if(lineaValida(l)&&!l.dto)l.dto=S.cliente.dto;});render();break;
    case 'aplicar-pagos':['tarjeta','bizum','transferencia'].forEach((m)=>{S.pagos[m]=S.cliente.pagos.includes(m);});render();break;
    case 'add-tramo':S.tramos.push({e:'',p:0});render();break;
    case 'opciones':abrirOpciones();break;
    case 'opciones-listo':guardarOpciones();break;
    case 'guardar-plantilla':abrirGuardarPlantilla();break;
    case 'plantilla-ok':{const n=$('#nomPlantilla').value.trim();if(!n){toast('Escribe un nombre para la plantilla.');break;}cerrarModal();toast(`Plantilla "${n}" guardada. Puedes usarla con el botón "📋 Usar plantilla".`);break;}
    case 'limpiar':modal(P('¿Vaciar este documento?'),`<p style="margin-top:0">${P('Se quitan el cliente, las líneas y los cambios de este documento. Tus plantillas y tus opciones de siempre no se tocan.')}</p>`,`<button class="btn btn-secondary" data-cerrar>${P('No, seguir')}</button><button class="btn btn-secondary" style="color:var(--danger)" data-accion="limpiar-ok">Limpiar formulario</button>`);break;
    case 'limpiar-ok':{const tipo=S.tipo;S=inicial();S.tipo=tipo;cerrarModal();render();break;}
    case 'continuar':irA(S.paso+1);break;
    case 'atras':irA(S.paso-1);break;
    case 'generar':if(!listo())break;if(S.generado&&esPres()){modal(P('Este presupuesto ya está generado'),`<p style="margin-top:0">${P('Generarlo otra vez crearía un segundo presupuesto. ¿Quieres ver el que ya tienes?')}</p>`,`<button class="btn btn-secondary" data-cerrar>Seguir editando</button><button class="btn btn-primary" data-accion="ver-generado">${P('Ver el presupuesto')} ${S.generado}</button>`);break;}abrirGenerado();break;
    case 'ver-generado':abrirGenerado();break;
    case 'enviar-wa':b.textContent='✓ Enviado por WhatsApp';b.disabled=true;toast('Presupuesto enviado por WhatsApp.');break;
    case 'enviar-email':b.textContent='✓ Enviado por email';b.disabled=true;toast('Presupuesto enviado por email.');break;
  }
});
document.addEventListener('input',(e)=>{
  const el=e.target;
  if(el.id==='busca'){S.busca=el.value;S.abiertoCliente=true;renderHoja();const b=$('#busca');b.focus();b.setSelectionRange(b.value.length,b.value.length);return;}
  if(el.id==='ia'){S.iaTexto=el.value;return;}
  if(el.dataset.k){const l=S.lineas[el.dataset.i];const k=el.dataset.k;
    if(k==='c'){l.c=el.value;const antes=S.autoLinea;S.autoLinea=Number(el.dataset.i);const abrir=el.value.length>=2;if(abrir||antes!==null){renderHoja();}refrescarNumeros();return;}
    l[k]=el.value===''?'':Number(el.value);refrescarNumeros();return;}
  if(el.id==='dtoGlobal'){S.dtoGlobal=el.value===''?null:Number(el.value);refrescarNumeros();return;}
  if(el.dataset.tramoE!==undefined){S.tramos[el.dataset.tramoE].e=el.value;return;}
  if(el.dataset.tramoP!==undefined){S.tramos[el.dataset.tramoP].p=Number(el.value)||0;refrescarNumeros();return;}
  if(el.id==='validez'){S.validez=el.value;return;}
});
document.addEventListener('change',(e)=>{
  const el=e.target;
  if(el.dataset.sug!==undefined){S.sugerencias[el.dataset.sug].on=el.checked;return;}
  if(el.dataset.pago){S.pagos[el.dataset.pago]=el.checked;guardadoAuto();return;}
  if(el.id==='resaltar'){document.body.classList.toggle('sin-resaltar',!el.checked);return;}
});
document.addEventListener('focusin',(e)=>{ if(e.target.id==='busca'&&!S.abiertoCliente){S.abiertoCliente=true;renderHoja();const b=$('#busca');b.focus();} });
document.addEventListener('focusout',(e)=>{ if(e.target.dataset&&e.target.dataset.k==='c'){setTimeout(()=>{if(!document.activeElement||!document.activeElement.dataset.auto){if(S.autoLinea!==null){S.autoLinea=null;renderHoja();}}},150);} });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'&&$('#capa').innerHTML){cerrarModal();} });
let ancho=pasosMovil(); addEventListener('resize',()=>{if(pasosMovil()!==ancho){ancho=pasosMovil();render();}});
