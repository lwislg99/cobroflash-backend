<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>YaQu — Crear cuenta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/auth.css"/>
</head>
<body>
<div class="auth-wrap">
<div class="card">
  <div class="logo">
    <div class="logo-mark">YQ</div>
    <div class="logo-text">YaQu</div>
  </div>
  <h1>Crea tu cuenta</h1>
  <div class="trial-badge">🎉 14 días gratis, sin tarjeta de crédito</div>
  <div id="ref-badge" class="trial-badge" style="display:none">🎁 Te ha invitado un amigo — ¡bienvenido!</div>
  <form id="register-form">
    <div class="field">
      <label for="name">Nombre de tu negocio</label>
      <input type="text" id="name" placeholder="Ej: Electricidad García" required autofocus/>
    </div>
    <div class="field">
      <label for="email">Tu email</label>
      <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email"/>
    </div>
    <div class="field">
      <label for="country">País</label>
      <select id="country">
        <option value="MX">México</option>
        <option value="CO">Colombia</option>
        <option value="ES" selected>España</option>
        <option value="AR">Argentina</option>
        <option value="PE">Perú</option>
        <option value="CL">Chile</option>
      </select>
    </div>
    <button class="btn" type="submit" id="btn">Crear cuenta y acceder</button>
  </form>
  <div id="alert" class="alert" role="alert" aria-live="assertive" style="display:none"></div>
  <div class="login-link">¿Ya tienes cuenta? <a href="/login.html">Acceder</a></div>
</div>
<footer class="auth-trust">
  <span>🔒 Conexión segura</span>
  <span class="sep">·</span>
  <span>Sin tarjeta de crédito</span>
  <span class="sep">·</span>
  <span>Cancelas cuando quieras</span>
</footer>
</div>
<script>
  // Código de referido desde la URL (?ref=CODIGO)
  const refCode = (new URLSearchParams(location.search).get('ref') || '').trim();
  if (refCode) document.getElementById('ref-badge').style.display = 'block';

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const country = document.getElementById('country').value;
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Creando cuenta…';
    try {
      const res = await fetch('/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, country, ref: refCode }) });
      const data = await res.json();
      if (res.ok) {
        showAlert('✉️ ¡Cuenta creada! Revisa tu email y haz clic en el enlace para acceder.', 'ok');
        btn.textContent = 'Enlace enviado';
        // Redirigir a login tras 3s para que puedan reenviar si no llega
        setTimeout(() => window.location.href = '/login.html', 4000);
      } else {
        const msgs = { invalid_email: 'Email inválido.', name_required: 'Escribe el nombre de tu negocio.' };
        showAlert(msgs[data.error] || data.error || 'Error al crear la cuenta.', 'error');
        btn.disabled = false; btn.textContent = 'Crear cuenta y acceder';
      }
    } catch { showAlert('Error de conexión.', 'error'); btn.disabled = false; btn.textContent = 'Crear cuenta y acceder'; }
  });

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg; el.className = 'alert ' + type; el.style.display = 'block';
  }
</script>
</body>
</html>
