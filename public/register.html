<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>YaQu — Crear cuenta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; font-feature-settings: "cv11","ss01";
      background: #f6f7f5; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px; }
    .card { background: #fff; border: 1px solid #e7e9e5; border-radius: 20px; padding: 32px 28px;
      width: 100%; max-width: 420px; box-shadow: 0 18px 40px -12px rgba(16,24,40,.18); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-mark { width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg,#22c55e,#22d3ee);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #052e16; }
    .logo-text { font-weight: 700; font-size: 20px; color: #0f172a; }
    h1 { margin: 0 0 6px; font-size: 22px; color: #0f1c17; letter-spacing: -.02em; }
    p  { margin: 0 0 24px; font-size: 14px; color: #6b756f; line-height: 1.5; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #333c37; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; font-size: 15px;
      border: 1px solid #e7e9e5; border-radius: 10px; outline: none; }
    input:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(34,197,94,.28); }
    select { width: 100%; padding: 12px 14px; font-size: 15px;
      border: 1px solid #e7e9e5; border-radius: 10px; outline: none; background: #fff; }
    .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
      background: #16a34a; color: #fff; border: none; border-radius: 12px;
      cursor: pointer; margin-top: 8px; transition: background .15s, box-shadow .15s;
      box-shadow: 0 1px 2px rgba(5,46,22,.18); }
    .btn:hover:not(:disabled) { background: #15803d; box-shadow: 0 4px 12px -2px rgba(16,24,40,.12); }
    .btn:disabled { opacity: .6; cursor: default; }
    .trial-badge { background: #eff6ff; color: #1d4ed8; font-size: 13px;
      padding: 8px 12px; border-radius: 8px; margin-bottom: 20px; }
    .alert { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 14px; }
    .alert.ok    { background: #ecfdf5; color: #166534; }
    .alert.error { background: #fef2f2; color: #991b1b; }
    .login-link { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
    .login-link a { color: #22c55e; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">YQ</div>
    <div class="logo-text">YaQu</div>
  </div>
  <h1>Crea tu cuenta</h1>
  <div class="trial-badge">🎉 14 días gratis, sin tarjeta de crédito</div>
  <div id="ref-badge" class="trial-badge" style="display:none;background:#ecfdf5;color:#047857">🎁 Te ha invitado un amigo — ¡bienvenido!</div>
  <form id="register-form">
    <div class="field">
      <label for="name">Nombre de tu negocio</label>
      <input type="text" id="name" placeholder="Ej: Electricidad García" required/>
    </div>
    <div class="field">
      <label for="email">Tu email</label>
      <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email"/>
    </div>
    <div class="field">
      <label for="country">País</label>
      <select id="country">
        <option value="MX">México</option>
        <option value="CO">Colombia</option>
        <option value="ES" selected>España</option>
        <option value="AR">Argentina</option>
        <option value="PE">Perú</option>
        <option value="CL">Chile</option>
      </select>
    </div>
    <button class="btn" type="submit" id="btn">Crear cuenta y acceder</button>
  </form>
  <div id="alert" class="alert" style="display:none"></div>
  <div class="login-link">¿Ya tienes cuenta? <a href="/login.html">Acceder</a></div>
</div>
<script>
  // Código de referido desde la URL (?ref=CODIGO)
  const refCode = (new URLSearchParams(location.search).get('ref') || '').trim();
  if (refCode) document.getElementById('ref-badge').style.display = 'block';

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const country = document.getElementById('country').value;
    const btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Creando cuenta…';
    try {
      const res = await fetch('/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, country, ref: refCode }) });
      const data = await res.json();
      if (res.ok) {
        showAlert('✉️ ¡Cuenta creada! Revisa tu email y haz clic en el enlace para acceder.', 'ok');
        btn.textContent = 'Enlace enviado';
        // Redirigir a login tras 3s para que puedan reenviar si no llega
        setTimeout(() => window.location.href = '/login.html', 4000);
      } else {
        const msgs = { invalid_email: 'Email inválido.', name_required: 'Escribe el nombre de tu negocio.' };
        showAlert(msgs[data.error] || data.error || 'Error al crear la cuenta.', 'error');
        btn.disabled = false; btn.textContent = 'Crear cuenta y acceder';
      }
    } catch { showAlert('Error de conexión.', 'error'); btn.disabled = false; btn.textContent = 'Crear cuenta y acceder'; }
  });

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.textContent = msg; el.className = 'alert ' + type; el.style.display = 'block';
  }
</script>
</body>
</html>
