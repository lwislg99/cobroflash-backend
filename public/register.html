<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>YaQu — Crear cuenta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="stylesheet" href="/fonts/inter.css"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/auth.css"/>
</head>
<body>
<div class="auth-wrap">
<div class="card">
  <div class="logo">
    <div class="logo-mark">YQ</div>
    <div class="logo-text">YaQu</div>
  </div>
  <h1>Crea tu cuenta</h1>
  <div class="trial-badge">🎉 14 días gratis, sin tarjeta de crédito</div>
  <div id="ref-badge" class="trial-badge" hidden>🎁 Te ha invitado un amigo — ¡bienvenido!</div>
  <form id="register-form">
    <div class="field">
      <label for="name">Nombre de tu negocio</label>
      <input type="text" id="name" placeholder="Ej: Electricidad García" required autofocus/>
    </div>
    <div class="field">
      <label for="email">Tu email</label>
      <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email"/>
    </div>
    <div class="field">
      <label for="country">País</label>
      <select id="country">
        <option value="MX">México</option>
        <option value="CO">Colombia</option>
        <option value="ES" selected>España</option>
        <option value="AR">Argentina</option>
        <option value="PE">Perú</option>
        <option value="CL">Chile</option>
      </select>
    </div>
    <!-- SCRUM-1685: con España, la provincia y el domicilio fiscal. Literales firmados: «Provincia» es el
         de la ficha del cliente, y las dos preguntas, las de docs/microcopy/2026-10-22-SCRUM-1536-exclusion-territorial.md
         (reuso firmado en SCRUM-1656 c.21408, entradas 22-23). «Sí»/«No», los de la ficha de Configuración. -->
    <div id="campos-es">
      <div class="field">
        <label for="provincia">Provincia</label>
        <!-- SCRUM-1685 b2: las 52 firmadas en SCRUM-1616 c.21066 (①48 con el artículo delante, ②las 4
             bilingües con la forma doble del INE, ③Ceuta y Melilla), copiadas de la tabla de
             docs/master/SCRUM-1616.md, en el orden de su código INE. value = la grafía, que zonaDeAlta acepta. -->
        <select id="provincia" autocomplete="address-level1" required>
          <option value=""></option>
          <option value="Araba/Álava">Araba/Álava</option>
          <option value="Albacete">Albacete</option>
          <option value="Alicante/Alacant">Alicante/Alacant</option>
          <option value="Almería">Almería</option>
          <option value="Ávila">Ávila</option>
          <option value="Badajoz">Badajoz</option>
          <option value="Illes Balears">Illes Balears</option>
          <option value="Barcelona">Barcelona</option>
          <option value="Burgos">Burgos</option>
          <option value="Cáceres">Cáceres</option>
          <option value="Cádiz">Cádiz</option>
          <option value="Castellón/Castelló">Castellón/Castelló</option>
          <option value="Ciudad Real">Ciudad Real</option>
          <option value="Córdoba">Córdoba</option>
          <option value="A Coruña">A Coruña</option>
          <option value="Cuenca">Cuenca</option>
          <option value="Girona">Girona</option>
          <option value="Granada">Granada</option>
          <option value="Guadalajara">Guadalajara</option>
          <option value="Gipuzkoa">Gipuzkoa</option>
          <option value="Huelva">Huelva</option>
          <option value="Huesca">Huesca</option>
          <option value="Jaén">Jaén</option>
          <option value="León">León</option>
          <option value="Lleida">Lleida</option>
          <option value="La Rioja">La Rioja</option>
          <option value="Lugo">Lugo</option>
          <option value="Madrid">Madrid</option>
          <option value="Málaga">Málaga</option>
          <option value="Murcia">Murcia</option>
          <option value="Navarra">Navarra</option>
          <option value="Ourense">Ourense</option>
          <option value="Asturias">Asturias</option>
          <option value="Palencia">Palencia</option>
          <option value="Las Palmas">Las Palmas</option>
          <option value="Pontevedra">Pontevedra</option>
          <option value="Salamanca">Salamanca</option>
          <option value="Santa Cruz de Tenerife">Santa Cruz de Tenerife</option>
          <option value="Cantabria">Cantabria</option>
          <option value="Segovia">Segovia</option>
          <option value="Sevilla">Sevilla</option>
          <option value="Soria">Soria</option>
          <option value="Tarragona">Tarragona</option>
          <option value="Teruel">Teruel</option>
          <option value="Toledo">Toledo</option>
          <option value="Valencia/València">Valencia/València</option>
          <option value="Valladolid">Valladolid</option>
          <option value="Bizkaia">Bizkaia</option>
          <option value="Zamora">Zamora</option>
          <option value="Zaragoza">Zaragoza</option>
          <option value="Ceuta">Ceuta</option>
          <option value="Melilla">Melilla</option>
        </select>
      </div>
      <div class="field">
        <label for="domicilio-foral">¿Tienes el domicilio fiscal en el País Vasco o en Navarra?</label>
        <select id="domicilio-foral" required>
          <option value=""></option>
          <option value="si">Sí</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="field">
        <label for="domicilio-canarias">¿Tienes el domicilio fiscal en Canarias?</label>
        <select id="domicilio-canarias" required>
          <option value=""></option>
          <option value="si">Sí</option>
          <option value="no">No</option>
        </select>
      </div>
    </div>
    <button class="btn" type="submit" id="btn">Crear cuenta y acceder</button>
  </form>
  <div id="alert" class="alert" role="alert" aria-live="assertive" hidden></div>
  <div class="login-link">¿Ya tienes cuenta? <a href="/login.html">Acceder</a></div>
</div>
<footer class="auth-trust">
  <span>🔒 Conexión segura</span>
  <span class="sep">·</span>
  <span>Sin tarjeta de crédito</span>
  <span class="sep">·</span>
  <span>Cancelas cuando quieras</span>
</footer>
</div>
<script src="/auth/js/alta.js"></script>
</body>
</html>
