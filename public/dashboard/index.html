<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>PresuFácil · Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./css/styles.css"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#22c55e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="PresuFácil"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.svg"/>
</head>
<body>
  <div class="layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-mark">PF</div>
        <div class="sidebar-logo-text">PresuFácil</div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Principal</div>

        <button class="nav-item" data-view="home">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 3l9 9M5 10v10a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V10"/></svg>
          <span>Inicio</span>
        </button>

        <button class="nav-item" data-view="quote-requests" id="nav-requests">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span>Solicitudes</span>
          <span id="req-badge" style="display:none;background:#ef4444;color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;margin-left:auto">0</span>
        </button>

        <button class="nav-item" data-view="customers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          <span>Clientes</span>
        </button>

        <div class="nav-group" data-group="quotes">
          <button class="nav-item nav-item-parent" type="button">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span id="nav-quotes-label">Presupuestos</span>
            <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="nav-subitems">
            <button class="nav-item nav-subitem" data-view="quotes-list">Historial</button>
            <button class="nav-item nav-subitem" data-view="quotes-new" id="nav-quotes-new">Crear nuevo</button>
          </div>
        </div>

        <div class="nav-section-label">Catálogo</div>

        <button class="nav-item" data-view="templates">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span>Plantillas</span>
        </button>

        <button class="nav-item" data-view="products">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
          <span>Productos</span>
        </button>

        <button class="nav-item" data-view="providers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Proveedores</span>
        </button>

        <div class="nav-section-label">Finanzas</div>

        <button class="nav-item" data-view="reports">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Informes</span>
        </button>

        <button class="nav-item" data-view="invoices">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span>Facturas</span>
        </button>

        <button class="nav-item" data-view="expenses">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          <span>Gastos</span>
        </button>

        <div class="nav-section-label">Cuenta</div>

        <button class="nav-item" data-view="plans" id="nav-plans">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Planes</span>
        </button>

        <button class="nav-item" data-view="team" id="nav-team">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          <span>Equipo</span>
        </button>

        <button class="nav-item" data-view="settings">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Configuración</span>
        </button>
      </nav>

      <div class="sidebar-user" id="sidebar-user">
        <!-- inyectado por app.js -->
      </div>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="topbar-hamburger" id="btn-hamburger" aria-label="Menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="topbar-title" id="view-title">Inicio</h1>
        </div>

        <!-- Búsqueda global -->
        <div id="global-search-wrap" style="flex:1;max-width:340px;margin:0 16px;position:relative">
          <div style="position:relative">
            <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--slate-400);pointer-events:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="global-search-input" type="text" autocomplete="off" spellcheck="false"
              placeholder="Buscar… (o pulsa /)"
              style="width:100%;padding:7px 12px 7px 32px;border:1.5px solid var(--slate-200);border-radius:var(--radius-full);font-size:13.5px;background:var(--slate-50);color:var(--slate-800);transition:border-color .12s,background .12s;font-family:inherit"/>
          </div>
          <div id="global-search-dropdown" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:300;max-height:400px;overflow-y:auto"></div>
        </div>

        <div class="topbar-right" id="topbar-right">
          <!-- inyectado por app.js -->
        </div>
      </header>

      <section id="view-container" class="view-container">
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="./js/api.js"></script>
  <script src="./js/homeView.js"></script>
  <script src="./js/onboardingView.js"></script>
  <script src="./js/plansView.js"></script>
  <script src="./js/customersView.js"></script>
  <script src="./js/quotesListView.js"></script>
  <script src="./js/quotesView.js"></script>
  <script src="./js/quotesDetailView.js"></script>
  <script src="./js/productsView.js"></script>
  <script src="./js/providersView.js"></script>
  <script src="./js/invoicesView.js"></script>
  <script src="./js/invoiceDetailView.js"></script>
  <script src="./js/expensesView.js"></script>
  <script src="./js/settingsView.js"></script>
  <script src="./js/teamView.js"></script>
  <script src="./js/aiQuoteAssistant.js"></script>
  <script src="./js/reportsView.js"></script>
  <script src="./js/templatesView.js"></script>
  <script src="./js/quoteRequestsView.js"></script>
  <script src="./js/customerDetailView.js"></script>
  <script src="./js/globalSearch.js"></script>
  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
