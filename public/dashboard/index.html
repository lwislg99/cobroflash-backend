      <!-- ═══════════════════════════════════════════════════════════════════════════════════
           SCRUM-420 (B1 · incremento 2) · LA BARRA POR CICLO DE VENTA.

           El orden y los rótulos salen de `docs/diseno/bloque-b.md` §B1 («Lo que proponemos»).
           Hasta hoy la barra era literalmente el «lo que hay hoy» de ese mismo diseño: el hueco
           estaba declarado en `docs/master/SCRUM-284.md:416` y SCRUM-284 se cerró, así que dejó de
           estar en ninguna lista. Por eso las ausencias de esta barra NO se anotan aquí: cada una
           cita el ticket ABIERTO que la va a cerrar, y `tests/scrum420-barra-lateral.test.mjs` las
           enumera para que no puedan pasar en silencio.

           Los tres primeros van SIN rótulo de grupo: «son el trabajo del día y no necesitan que
           nadie los clasifique» (diseño).
           ═══════════════════════════════════════════════════════════════════════════════════ -->
      <nav class="sidebar-nav">

          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12L12 3l9 9M5 10v10a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V10"/></svg>
          <span>Inicio</span>
        </button>

        <button class="nav-item" data-view="quote-requests" id="nav-requests">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>

        </button>

        <button class="nav-item" data-view="jobs" id="nav-jobs">

          <span>Trabajos</span>

             sigue ABIERTA) en el mismo commit que su pantalla. El menú crece cuando existe el
             destino: una entrada que apunta a nada es una promesa rota cada vez que se pulsa.
             El rótulo «Cobros» ya está aprobado, para que B4 no tenga que pedirlo. -->
        <div class="nav-section-label">Venta</div>

        <div class="nav-group" data-group="quotes">

             medio hay un estado en el que la vista `templates` no es alcanzable desde ningún sitio,
             y ese estado no puede llegar a `main`.
             El camino de hoy: `quotesTabs.js` lo pinta en las DOS vistas, y `#templates` sigue en
             `HASH_VIEWS`, así que un enlace guardado por el profesional no se rompe. -->

        <button class="nav-item" data-view="customers">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>

          <span>Informes</span>

             VeriFactu: todo lo que se pinte DENTRO de esa pantalla sigue bajo la regla 26 y sale
             del guion H2. Va en NEGOCIO y no en VENTA porque un libro registro no es un paso del
             ciclo (Presupuestos → Albaranes → Facturas → Cobros): es un registro del negocio, y

        <div class="nav-section-label">Cuenta</div>

            <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--neutral-400);pointer-events:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        </div>

        <div class="topbar-right" id="topbar-right">
          <!-- inyectado por app.js -->
        </div>
      </header>

      <section id="view-container" class="view-container">
      </section>
    </main>

  <!-- SCRUM-224b: el build con el que ESTE HTML fue servido. Lo rellena la ruta de app.ts al
       servir /dashboard/. Si el valor llega con el marcador SIN sustituir, app.js lo trata como
       ausente y vuelve a inferir la linea base (comportamiento anterior), en vez de disparar el
       aviso en cada poll. Este comentario NO nombra el marcador a proposito: hacerlo se comia
       la sustitucion, porque caia antes que el meta. -->
  <meta name="yaqu-build" content="__BUILD_ID__">
