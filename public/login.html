<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>YaQu — Acceder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased; font-feature-settings: "cv11","ss01";
      background: #f6f7f5; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px; }
    .card { background: #fff; border: 1px solid #e7e9e5; border-radius: 20px; padding: 32px 28px;
      width: 100%; max-width: 400px; box-shadow: 0 18px 40px -12px rgba(16,24,40,.18); }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-mark { width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg,#22c55e,#22d3ee);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: #052e16; }
    .logo-text { font-weight: 700; font-size: 20px; color: #0f172a; }
    h1 { margin: 0 0 6px; font-size: 22px; color: #0f1c17; letter-spacing: -.02em; }
    p  { margin: 0 0 24px; font-size: 14px; color: #6b756f; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type=email] { width: 100%; padding: 12px 14px; font-size: 15px;
      border: 1px solid #d1d5db; border-radius: 10px; outline: none; }
    input[type=email]:focus { border-color: #16a34a; box-shadow: 0 0 0 3px rgba(34,197,94,.28); }
    .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
      background: #16a34a; color: #fff; border: none; border-radius: 12px;
      cursor: pointer; margin-top: 16px; transition: background .15s, box-shadow .15s;
      box-shadow: 0 1px 2px rgba(5,46,22,.18); }
    .btn:hover:not(:disabled) { background: #15803d; box-shadow: 0 4px 12px -2px rgba(16,24,40,.12); }
    .btn:disabled { opacity: .6; cursor: default; }
    .alert { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; }
    .alert.ok    { background: #ecfdf5; color: #166534; }
    .alert.error { background: #fef2f2; color: #991b1b; }
    .resend-row { margin-top: 14px; text-align: center; font-size: 13px; color: #6b7280; }
    .resend-row a { color: #22c55e; font-weight: 600; text-decoration: none; cursor: pointer; }
    .resend-row a:hover { text-decoration: underline; }
    .register-link { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
    .register-link a { color: #22c55e; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">YQ</div>
    <div class="logo-text">YaQu</div>
  </div>
  <h1>Acceder</h1>
  <p>Introduce tu email y te enviamos un enlace mágico para entrar sin contraseña.</p>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email"/>
    <button class="btn" type="submit" id="btn">Enviar enlace de acceso</button>
  </form>
  <div id="alert" class="alert" style="display:none"></div>
  <div id="resend-row" class="resend-row" style="display:none"></div>
  <div class="register-link">¿Primera vez? <a href="/register.html">Crea tu cuenta gratis</a></div>
</div>
<script>
  // Si ya hay sesión válida, redirigir al dashboard
  fetch('/admin/me').then(r => { if (r.ok) window.location.href = '/dashboard/'; }).catch(() => {});

  // Mostrar errores de URL
  const params = new URLSearchParams(location.search);
  if (params.get('error')) {
    const msgs = {
      link_expired:   'El enlace ha caducado o ya fue usado. Solicita uno nuevo.',
      invalid_token:  'Enlace inválido.',
      internal_error: 'Error interno. Inténtalo de nuevo.',
    };
    showAlert(msgs[params.get('error')] || 'Error desconocido.', 'error');
  }

  let countdownTimer = null;

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    sendLink();
  });

  async function sendLink() {
    const emailInput = document.getElementById('email');
    const email = emailInput.value.trim();
    const btn = document.getElementById('btn');

    clearInterval(countdownTimer);
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    document.getElementById('resend-row').style.display = 'none';

    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (res.ok) {
        showAlert('✉️ Enlace enviado. Revisa tu bandeja de entrada (y spam).', 'ok');
        emailInput.disabled = true;
        startCountdown(60);
      } else {
        showAlert(data.error || 'Error al enviar el enlace.', 'error');
        btn.disabled = false;
        btn.textContent = 'Enviar enlace de acceso';
      }
    } catch {
      showAlert('Error de conexión. Comprueba tu internet.', 'error');
      btn.disabled = false;
      btn.textContent = 'Enviar enlace de acceso';
    }
  }

  function startCountdown(seconds) {
    const btn = document.getElementById('btn');
    const resendRow = document.getElementById('resend-row');
    let remaining = seconds;

    resendRow.style.display = 'block';
    resendRow.innerHTML = `¿No llegó? Puedes reenviar en <strong id="countdown">${remaining}s</strong>`;

    countdownTimer = setInterval(() => {
      remaining--;
      const el = document.getElementById('countdown');
      if (el) el.textContent = remaining + 's';

      if (remaining <= 0) {
        clearInterval(countdownTimer);
        btn.disabled = false;
        btn.textContent = 'Enviar enlace de acceso';
        document.getElementById('email').disabled = false;
        resendRow.innerHTML = '¿No llegó? <a onclick="sendLink()">Reenviar enlace</a> · <a onclick="changeEmail()">Cambiar email</a>';
      }
    }, 1000);
  }

  function changeEmail() {
    clearInterval(countdownTimer);
    document.getElementById('email').disabled = false;
    document.getElementById('email').value = '';
    document.getElementById('email').focus();
    document.getElementById('btn').disabled = false;
    document.getElementById('btn').textContent = 'Enviar enlace de acceso';
    document.getElementById('alert').style.display = 'none';
    document.getElementById('resend-row').style.display = 'none';
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.innerHTML = msg;
    el.className = 'alert ' + type;
    el.style.display = 'block';
  }
</script>
</body>
</html>
