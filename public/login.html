<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>YaQu — Acceder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="stylesheet" href="/fonts/inter.css"/>
  <link rel="stylesheet" href="/tokens.css"/>
  <link rel="stylesheet" href="/auth.css"/>
  <!-- SCRUM-336: esta página también enlaza al registro, así que su CTA tiene que propagar la
       atribución de la URL igual que la landing. El script no guarda nada en el navegador. -->
  <script src="/js/atribucion.js" defer></script>
</head>
<body>
<div class="auth-wrap">
<div class="card">
  <div class="logo">
    <div class="logo-mark">YQ</div>
    <div class="logo-text">YaQu</div>
  </div>
  <h1>Acceder</h1>
  <p>Introduce tu email y te enviamos un enlace mágico para entrar sin contraseña.</p>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" autofocus/>
    <button class="btn" type="submit" id="btn">Enviar enlace de acceso</button>
  </form>
  <div id="alert" class="alert" role="alert" aria-live="assertive" hidden></div>
  <div id="resend-row" class="resend-row" hidden></div>
  <div class="register-link">¿Primera vez? <a href="/register.html">Crea tu cuenta gratis</a></div>
</div>
<footer class="auth-trust">
  <span>🔒 Acceso seguro</span>
  <span class="sep">·</span>
  <span>Sin contraseñas que recordar</span>
</footer>
</div>
<!-- SCRUM-1647c: el guion vive en src/modules/auth/app/routes/loginNavegador.ts (servido desde 'self'),
     para que la CSP se pueda aplicar sin 'unsafe-inline'. -->
<script src="/auth/js/login.js"></script>
</body>
</html>
